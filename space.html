<script>
/* =========================================================
   TACTICAL SPACE BATTLE

   What makes it tactical:
   - Ships have inertia: they accelerate, turn slowly and cannot strafe.
   - Weapons fire only inside their ARCS: broadside batteries to the
     sides, lances and torpedoes straight ahead, turrets all round.
     So where a ship POINTS is the whole game.
   - Damage goes through void shields -> armour -> hull. Light guns
     cannot hurt heavy armour; lances, railguns and torpedoes can.
   - Each ship class has a role (screen, raider, lance, sniper, line,
     bombardment, carrier). Flak turrets shoot torpedoes down.
   - Terrain: asteroids block fire, a nebula spoils aim, a planet
     blocks the way.
   - Orders: move, attack, right-drag to set the final heading,
     power allocation, brace for impact.

   One player's browser (the HOST) runs the simulation and sends it
   10 times a second; the others are guests who see it and send orders.
   Ships of absent players are flown by the AI.
========================================================= */

const params = new URLSearchParams(location.search);
const battleId = params.get("battle");

const WORLD_W = 3600;
const WORLD_H = 2000;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

const cam = { x: WORLD_W / 2, y: WORLD_H / 2, z: 0.45 };

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

function toWorld(ev) {
    const r = canvas.getBoundingClientRect();
    return {
        x: (ev.clientX - r.left - canvas.width / 2) / cam.z + cam.x,
        y: (ev.clientY - r.top - canvas.height / 2) / cam.z + cam.y
    };
}

/* ---------------------------------------------------------
   DATA
--------------------------------------------------------- */

const FACTION_COLORS = { "Combine": "#ff4a4a", "Freedom Authority": "#4a8cff", "Independents": "#e6e6e6" };
const fcol = f => FACTION_COLORS[f] || "#ffd27a";

const DIVISION_SIZE = { Rifle: 1000, MG: 750, Assault: 1000, AT: 600, Sniper: 400, Tank: 200, Artillery: 250, Krieg: 1000, Arstartes: 100, Knightmare: 3 };
function sizeOf(type) { return DIVISION_SIZE[type] || 1000; }

/* weapon arcs: [centre angle relative to the bow in degrees, half-width in degrees] */
const ARC_SIDES = [[90, 58], [-90, 58]];
const ARC_BOW = (half) => [[0, half]];
const ARC_ALL = [[0, 180]];

/*
   One entry per division type. len = ship length in world units.
   hull / armour / shield, speed (units per second), accel, turn (rad/s), evade (0..1),
   style = how the AI (and ordered attacks) manoeuvre, pref = preferred fighting distance.
*/

    },
    Assault: {

        style: "kite", pref: 760, mods: ["lance", "turret"],
        weapons: [
            { id: "lance", kind: "lance", name: "Lance", dmg: 100, n: 1, rate: 2800, range: 950, acc: 0.92, arcs: ARC_BOW(14), bypass: 0.6, pierce: 0.8 },
            { id: "tur", kind: "turret", name: "Turret", dmg: 2.4, n: 1, rate: 320, range: 240, acc: 0.8, arcs: ARC_ALL }
        ]
    },
    Sniper: {

            { id: "tur", kind: "turret", name: "Turrets", dmg: 2.6, n: 1, rate: 260, range: 280, acc: 0.8, arcs: ARC_ALL }
        ]
    },
    Artillery: {
