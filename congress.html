select, input[type=number] { background: #0a1424; color: #fff; border: 1px solid #355690; padding: 7px 9px; font-size: 13px; min-width: 200px; }

<script>
/* =========================================================
   FREEDOM AUTHORITY CONGRESS (screen)
   Everything is decided by the server (stage15.sql); this page
   shows the chamber and sends proposals and bribes.
========================================================= */

/* cost is always 0: a bill never costs the treasury anything, whether it passes
   or not (the database enforces the same thing with cg_bills_are_free) */
const TYPES = {
    military_action: { name: "Declaration of War on Planet", votes: "majority", cost: 0, desc: "Authorize a military strike on a specific planet. Without it Freedom Authority fleets cannot attack." },
    fleet_construction: { name: "Authorize New Fleet Construction", votes: "supermajority", cost: 0, desc: "Approve one new military fleet (build it from the galaxy map afterwards)." },
    knightmare_construction: { name: "Authorize Knightmare Squad Formation", votes: "supermajority", cost: 0, desc: "Approve one elite Knightmare squad (the Knightmare Facility chain is still needed)." },
    resource_allocation: { name: "Emergency Economic Relief", votes: "majority", cost: 0, desc: "Civilian relief for occupied worlds: stability +10, paid for by the treasury when it passes (400 credits)." },
    taxation: { name: "Taxation Increase Proposal", votes: "supermajority", cost: 0, desc: "Raise taxes on the member worlds: 300-500 credits every 15 minutes per level (max 2), popularity -5." },
    fleet_revocation: { name: "Military Asset Recall and Decommission", votes: "supermajority", cost: 0, desc: "Recall and dismantle one of your fleets for 500 credits of salvage." }
};

let ov = null;
let tab = "proposals";
let selMember = null;
let selProposal = null;
let regionFilter = null;
let factionFilter = null;
let groupBy = "faction";      /* the chamber is grouped in the Congress factions (or by region) */
let warTarget = null;
let skew = 0;            /* server time minus browser time */
let draft = { type: "fleet_construction", planet: "", fleet: "", target: "Combine", sponsor: "" };
let positions = [];
let propState = null;     /* cooldowns and treasury for the propaganda tab */
let propError = null;     /* set when the propaganda functions are not installed yet */
let debate = null;        /* the sides every live bill's delegates are on */
let debateError = null;

let unrest = null;        /* how much every occupied world resents it */


/* how many men a band is before it takes recruits (2026-11-40) */

let rebelBase = 0;
let speaker = null;       /* the Congress's own president and its election */

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Number(n || 0).toLocaleString();
/* translate a fragment while the sentence is being built (a label glued to a
   number is never a text node of its own, so the page translator cannot see it) */
const T = s => (typeof window.t === "function" ? window.t(s) : s);

function toast(text, err) {
    const t = $("toast");
    t.textContent = text;
    t.className = err ? "err" : "";
    t.style.display = "block";
    clearTimeout(toast.h);
    toast.h = setTimeout(() => { t.style.display = "none"; }, 5200);
}

/* the game's own confirmation box, drawn like the NOTICE card the rest of the
   game shows (the browser's confirm() cannot be styled or translated) */
function gameConfirm(message, title) {

    return new Promise(function(resolve) {

        const old = document.getElementById("game-confirm");
        if (old) { old.remove(); }

        const overlay = document.createElement("div");
        overlay.id = "game-confirm";
        overlay.style.cssText =
            "position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;";

        const card = document.createElement("div");
        card.style.cssText =
            "width:380px;max-width:90vw;background:rgba(8,12,22,.97);border:1px solid #7fdcff;" +
            "box-shadow:0 0 24px rgba(80,200,255,.35);padding:18px 20px;color:#dfeaf2;" +
            "font:14px Arial,sans-serif;line-height:1.5;";

        const h = document.createElement("div");
        h.style.cssText = "font-weight:bold;letter-spacing:2px;color:#7fdcff;margin-bottom:8px;";
        h.textContent = (title || "NOTICE").toUpperCase();

        const p = document.createElement("div");
        p.textContent = message;

        const row = document.createElement("div");
        row.style.cssText = "display:flex;gap:8px;margin-top:14px;";

        const yes = document.createElement("button");
        yes.type = "button";
        yes.textContent = "OK";
        yes.style.cssText =
            "padding:7px 26px;background:#10202e;color:#fff;border:1px solid #7fdcff;cursor:pointer;font-weight:bold;";

        const no = document.createElement("button");
        no.type = "button";
        no.textContent = "CANCEL";
        no.style.cssText =
            "padding:7px 20px;background:transparent;color:#cfe3ff;border:1px solid #355690;cursor:pointer;font-weight:bold;";

        const finish = function(ok) {
            overlay.remove();
            document.removeEventListener("keydown", onKey);
            resolve(ok);
        };

        const onKey = function(e) {
            if (e.key === "Escape") { finish(false); }
            else if (e.key === "Enter") { finish(true); }
        };

        yes.addEventListener("click", function() { finish(true); });
        no.addEventListener("click", function() { finish(false); });
        overlay.addEventListener("click", function(e) { if (e.target === overlay) { finish(false); } });
        document.addEventListener("keydown", onKey);

        row.appendChild(yes);
        row.appendChild(no);
        card.appendChild(h);
        card.appendChild(p);
        card.appendChild(row);
        overlay.appendChild(card);
        document.body.appendChild(overlay);
        yes.focus();

    });

}

function factionById(id) { return (ov.factions || []).find(f => f.id === id) || { name: "?", color: "#888", priorities: [] }; }

function secondsLeft(ts) { return Math.max(0, Math.round((new Date(ts).getTime() - (Date.now() + skew)) / 1000)); }
function mmss(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

/* ---------------------------------------------------------
   LOAD
--------------------------------------------------------- */
async function load() {

    const { data, error } = await supabaseClient.rpc("congress_overview");

    if (error) {
        $("tabbody").innerHTML = '<div class="card"><h3>Congress is not available</h3><div class="sub">' + esc(error.message) +
            '<br><br>Only Freedom Authority players have a Congress, and stage15.sql must have been run.</div></div>';
        return;
    }

    ov = data;
    skew = new Date(ov.now).getTime() - Date.now();

    /* the unrest bars of the occupied worlds (its own book, so the Congress's
       own overview is untouched) */
    await supabaseClient.rpc("unrest_tick");

    /* the committees and the ministries (2026-11-15). The error is kept, not
       swallowed: a tab that says "run the patch" when the patch is already
       in is worse than one that says why it failed. */
    const gv = await supabaseClient.rpc("cg_government");
    gov = gv.error ? null : gv.data;
    govError = gv.error ? gv.error.message : null;
    const us = await supabaseClient.rpc("unrest_state");
    unrest = us.error ? null : us.data;

    /* the men a band holds before it recruits: what stands over that
       is blood the garrison has lost to the militia */
    const bandBase = await supabaseClient.rpc("rebel_band_size");
    rebelBase = bandBase && !bandBase.error && bandBase.data != null ? Number(bandBase.data) : 0;

    /* the chamber's president: its own book, its own election */
    const spk = await supabaseClient.rpc("cg_speaker_state");
    speaker = spk.error ? null : spk.data;

    /* the propaganda offices also carry the fleet count, which decides the
       odds of a fleet bill: both the PROPAGANDA tab and the fleet cards use it */
    const ps = await supabaseClient.rpc("congress_propaganda_state");
    propState = ps.error ? null : ps.data;
    propError = ps.error ? ps.error.message : null;

    /* the debate moves a few delegates every 15 seconds (the server throttles
       it), and the view tells us where the chamber stands right now */
    const dr = await supabaseClient.rpc("cg_debate_view");
    debate = dr.error ? null : dr.data;
    debateError = dr.error ? dr.error.message : null;

    if (!dr.error) { supabaseClient.rpc("cg_debate_tick"); }

    if (!draft.sponsor) { draft.sponsor = "old_guard"; }
    if (!draft.planet && ov.targets.length) { draft.planet = ov.targets[0].planet; }
    if (!draft.fleet && ov.my_fleets.length) { draft.fleet = ov.my_fleets[0].id; }
    if (selProposal && !ov.proposals.find(p => p.id === selProposal)) { selProposal = null; }

    render();

}

function render() {

    const pres = ov.president;
    $("st-pres").textContent = pres && pres.name ? pres.name : "vacant";
    $("st-pres").style.color = pres && pres.name ? factionById(pres.faction).color : "#8fa6c4";
    $("st-credits").textContent = fmt(ov.credits);
    $("st-pop").textContent = Math.round(ov.state.popularity) + "%";
    $("st-tax").textContent = ov.state.tax_level + " / 2";
    $("st-seats").textContent = ov.seats;
    $("st-need").textContent = ov.majority + " / " + ov.supermajority;
    $("st-need").title = "votes needed: majority / supermajority";

    renderLegend();
    renderRegions();
    renderHemicycle();
    renderMember();
    renderTabs();

}

/* ---------------------------------------------------------
   THE CHAMBER
--------------------------------------------------------- */
function wireLegend() {
    $("legend").querySelectorAll(".fchip").forEach(el => el.addEventListener("click", function() {
        const id = Number(el.dataset.f);
        factionFilter = factionFilter === id ? null : id;
        renderLegend(); renderHemicycle();
    }));
}

/* which live bill the dome is showing: the selected one, or the first live one */
function liveDebateFor(id) {
    if (!debate || !debate.proposals) { return null; }
    return debate.proposals.find(x => x.id === id) || null;
}

function paintedDebate() {
    if (!debate || !debate.proposals || !debate.proposals.length) { return null; }
    return debate.proposals.find(x => x.id === selProposal) || debate.proposals[0];
}

function renderLegend() {

    setTimeout(wireLegend, 0);

    const dv = paintedDebate();
    const pr = dv ? ov.proposals.find(x => x.id === dv.id) : null;

    $("legend").innerHTML = ov.factions.map(f =>
        '<span class="chip fchip" data-f="' + f.id + '" style="cursor:pointer;' + (factionFilter === f.id ? "border-color:#fff;background:#1d3a6b;" : "") + '"><span class="dot" style="background:' + esc(f.color) + '"></span>' + esc(f.name) + ' &middot; <b>' + f.seats + '</b> ' + T("seats") + ' &middot; ' + T("loyalty") + ' ' + f.loyalty + '</span>'
    ).join("") + '<span class="chip"><span class="dot" style="background:transparent;border:2px dashed #ffd37a"></span>' + esc(T("suspected of corruption")) + '</span>' +
    (dv ? '<span class="chip" style="border-color:#7dff9d"><span class="dot" style="background:transparent;border:2px solid #7dff9d"></span>' + esc(T("voting yes")) +
        '</span><span class="chip" style="border-color:#ff8a8a"><span class="dot" style="background:transparent;border:2px solid #ff8a8a"></span>' + esc(T("voting no")) +
        '</span><span class="chip">' + esc(pr ? pr.title : "") + ' &middot; ' + T("YES") + ' ' + dv.yes + ' &middot; ' + T("NO") + ' ' + dv.no + ' &middot; ' + T("UNDECIDED") + ' ' + dv.undecided +
        '</span>' : "");
}

function renderRegions() {
    const regions = [];
    for (const m of ov.members) { if (regions.indexOf(m.region) === -1) { regions.push(m.region); } }
    $("regionbar").innerHTML = '<span class="rchip' + (groupBy === "faction" ? " on" : "") + '" data-g="faction">GROUP BY FACTION</span>' +
        '<span class="rchip' + (groupBy === "region" ? " on" : "") + '" data-g="region">GROUP BY REGION</span>' +
        '<span class="rchip' + (regionFilter ? "" : " on") + '" data-r="">ALL REGIONS</span>' +
        regions.map(r => '<span class="rchip' + (regionFilter === r ? " on" : "") + '" data-r="' + esc(r) + '">' + esc(r) + ' (' + ov.members.filter(m => m.region === r).length + ')</span>').join("");
    $("regionbar").querySelectorAll(".rchip").forEach(el => el.addEventListener("click", function() {
        if (el.dataset.g) { groupBy = el.dataset.g; }
        else { regionFilter = el.dataset.r || null; }
        renderRegions(); renderHemicycle();
    }));
}

/* seats sit on concentric half-rings; sorted by angle so every region is a wedge */
function layoutSeats(n) {

    const rows = n > 190 ? 9 : 8;
    const r0 = 150, r1 = 360;
    const radii = [];
    for (let i = 0; i < rows; i++) { radii.push(r0 + (r1 - r0) * i / (rows - 1)); }
    const sum = radii.reduce((a, b) => a + b, 0);

    const counts = radii.map(r => Math.round(n * r / sum));
    let diff = n - counts.reduce((a, b) => a + b, 0);
    for (let i = rows - 1; diff !== 0; i = (i - 1 + rows) % rows) { counts[i] += diff > 0 ? 1 : -1; diff += diff > 0 ? -1 : 1; }

    const pts = [];

    radii.forEach(function(r, i) {
        for (let j = 0; j < counts[i]; j++) {
            const a = Math.PI - Math.PI * (j + 0.5) / counts[i];
            pts.push({ x: 380 + Math.cos(a) * r, y: 395 - Math.sin(a) * r, a: a, r: r });
        }
    });

    pts.sort((p, q) => (q.a - p.a) || (p.r - q.r));
    return pts;

}

function renderHemicycle() {

    /* the chamber is grouped in the Congress factions: every faction is one block of the half circle */
    const members = ov.members.slice().sort(groupBy === "faction"
        ? (a, b) => (a.faction - b.faction) || (a.planet ? 1 : 0) - (b.planet ? 1 : 0) || String(a.region).localeCompare(String(b.region)) || (a.area || 0) - (b.area || 0) || a.seat - b.seat
        : (a, b) => (a.planet ? 1 : 0) - (b.planet ? 1 : 0) || String(a.region).localeCompare(String(b.region)) || (a.area || 0) - (b.area || 0) || a.seat - b.seat);

    if (positions.length !== members.length) { positions = layoutSeats(members.length); }

    const bribed = new Set();
    const pr = ov.proposals.find(p => p.id === selProposal);
    if (pr) { for (const b of pr.bribes) { bribed.add(b.member); } }

    /* the bill the dome is showing, and the side every delegate is on */
    const painting = paintedDebate();

    let svg = '<path d="M20 395 A360 360 0 0 1 740 395" fill="none" stroke="#1b2f52" stroke-width="1"/>';

    members.forEach(function(m, i) {
        const p = positions[i];
        const f = factionById(m.faction);
        const dim = (regionFilter && m.region !== regionFilter) || (factionFilter && m.faction !== factionFilter);
        svg += '<circle class="seat" data-i="' + i + '" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + (m.planet ? 8 : 7.2) + '" fill="' + esc(f.color) + '" opacity="' + (dim ? 0.15 : 1) + '"' +
            (selMember === m.id ? ' stroke="#fff" stroke-width="3"' : m.suspect ? ' stroke="#ffd37a" stroke-width="2.2" stroke-dasharray="3 2"' : bribed.has(m.id) ? ' stroke="#7dff9d" stroke-width="2.5"' : m.planet ? ' stroke="#4cc2ff" stroke-width="2"' : '') + '/>';

        /* a ring for the side the debate left them on */
        const side = painting && painting.sides ? painting.sides[String(m.id)] : null;

        if (side === "yes" || side === "no") {
            svg += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + (m.planet ? 11 : 10) + '"' +
                ' fill="none" stroke="' + (side === "yes" ? "#7dff9d" : "#ff8a8a") + '" stroke-width="1.8"' +
                ' opacity="' + (dim ? 0.2 : 0.9) + '" pointer-events="none"/>';
        }

    });

    /* names of the blocks around the arc */
    if (groupBy === "faction") {
        const sums = {};
        members.forEach(function(m, i) {
            const k = m.faction;
            sums[k] = sums[k] || { a: 0, n: 0 };
            sums[k].a += positions[i].a; sums[k].n++;
        });
        Object.keys(sums).forEach(function(k) {
            const f = factionById(Number(k));
            const a = sums[k].a / sums[k].n;
            /* the name runs ALONG the arc in the margin outside the seats,
               so it can never sit on top of the delegates */
            const rr = 386;
            const x = (380 + Math.cos(a) * rr).toFixed(1);
            const y = (395 - Math.sin(a) * rr).toFixed(1);
            const deg = (90 - a * 180 / Math.PI).toFixed(1);
            svg += '<text transform="translate(' + x + ',' + y + ') rotate(' + deg + ')" text-anchor="middle" ' +
                'fill="' + esc(f.color) + '" font-size="10" font-weight="800" letter-spacing="0.5" ' +
                'stroke="#050a12" stroke-width="3" stroke-linejoin="round" paint-order="stroke">' +
                esc(f.name.toUpperCase()) + '</text>';
        });
    }

    svg += '<text x="380" y="360" text-anchor="middle" fill="#8fb4e8" font-size="15" letter-spacing="4" font-weight="800">CONGRESS</text>' +
        '<text x="380" y="380" text-anchor="middle" fill="#6f87aa" font-size="11" letter-spacing="2">' + ov.seats + ' DELEGATES</text>';

    $("hemi").innerHTML = svg;

    $("hemi").querySelectorAll(".seat").forEach(function(el) {
        const m = members[Number(el.dataset.i)];
        el.addEventListener("click", function() { selMember = m.id; render(); });
        el.addEventListener("mousemove", function(ev) {
            const f = factionById(m.faction);
            const t = $("tip");
            t.style.display = "block";
            t.style.left = (ev.clientX + 14) + "px";
            t.style.top = (ev.clientY + 14) + "px";
            t.innerHTML = '<b>' + esc(m.name) + '</b><br><span style="color:' + esc(f.color) + '">' + esc(f.name) + '</span><br>' +
                esc(m.planet ? "Delegate of " + m.planet : m.region + ", area " + m.area) + '<br>Loyalty ' + m.loyalty + (m.suspect ? "<br>Rumours of corruption" : "");
        });
        el.addEventListener("mouseleave", function() { $("tip").style.display = "none"; });
    });

}

/* ---------------------------------------------------------
   A DELEGATE'S VOTING RECORD (read only, from cg_votes)
--------------------------------------------------------- */
let memberHistory = {};   /* member id -> the last votes, kept between renders */

async function loadMemberHistory(id) {

    const known = memberHistory[id];

    if (known && known.loading) { return; }

    /* a bill can resolve while the page is open: keep the record for two minutes */
    if (known && (known.votes || known.error) && Date.now() - (known.at || 0) < 120000) { return; }

    memberHistory[id] = { loading: true };

    const { data, error } = await supabaseClient.rpc("congress_member_history", { p_member: id });

    memberHistory[id] = error ? { error: error.message, at: Date.now() } : Object.assign({ at: Date.now() }, data);
    paintMemberHistory(id);

}

function paintMemberHistory(id) {

    const box = $("m-hist");
    if (!box || selMember !== id) { return; }

    const rec = memberHistory[id];

    if (!rec || rec.loading) {
        box.innerHTML = '<div class="sub">' + esc(T("Loading the voting record...")) + '</div>';
        return;
    }

    if (rec.error) {
        box.innerHTML = '<div class="sub">' +
            esc(T("The voting record is not installed yet: run sql/2026-10-27_delegate_history.sql in the Supabase SQL editor.")) +
            '</div><div class="sub" style="color:#ff8a8a;margin-top:4px">' + esc(rec.error) + '</div>';
        return;
    }

    const rows = rec.votes || [];

    let h = '<div class="sub">' + T("YES") + ' ' + rec.yes + ' &middot; ' + T("NO") + ' ' + rec.no + ' &middot; ' +
        T("ABSTAIN") + ' ' + rec.abstain + ' &middot; ' + T("bribes taken:") + ' ' + rec.bribed + '</div>';

    if (!rows.length) {
        return void (box.innerHTML = h + '<div class="sub" style="margin-top:6px">' + esc(T("This delegate has not voted yet.")) + '</div>');
    }

    h += rows.map(function(v) {
        const word = v.vote === "yes" ? T("YES") : v.vote === "no" ? T("NO") : T("ABSTAIN");
        const colour = v.vote === "yes" ? "#7dff9d" : v.vote === "no" ? "#ff8a8a" : "#8fa6c4";
        return '<div class="log"><b style="color:' + colour + '">' + esc(word) + '</b>' +
            (v.bribed ? ' <span class="badge live">' + esc(T("BOUGHT")) + '</span>' : "") +
            ' ' + esc(v.title) + '</div>';
    }).join("");

    box.innerHTML = h;

}

function renderMember() {

    const box = $("member");
    const m = ov.members.find(x => x.id === selMember);

    if (!m) { box.innerHTML = '<div class="sub" style="padding:10px 0">Click a delegate to see who they are. While a proposal is in debate you can try to win their vote.</div>'; return; }

    const f = factionById(m.faction);
    const pr = ov.proposals.find(p => p.id === selProposal);
    const debate = pr && pr.status === "debate" ? pr : null;

    let have = 0;

    let h = '<div class="card"><h3><span class="dot" style="background:' + esc(f.color) + '"></span> ' + esc(m.name) + '</h3>' +
        '<div class="sub">' + esc(f.name) + ' &middot; ' + esc(m.planet ? T("delegate of the occupied world") + " " + m.planet : m.region + ", " + T("area") + " " + m.area + ", " + T("seat") + " " + m.seat) + '</div>' +
        '<div class="sub" style="margin-top:6px">' + T("LOYALTY") + ' ' + m.loyalty + '%</div><div class="bar"><i style="width:' + m.loyalty + '%;background:#4cc2ff"></i></div>' +
        (m.suspect ? '<div class="sub" style="color:#ffd37a">Rumours of corruption surround this delegate.</div>' : "");

    if (debate) {

        const mine = debate.bribes.filter(b => b.member === m.id);
        have = mine.reduce((n, b) => n + b.amount, 0);
        const stance = mine.length ? mine[0].stance : "yes";

        h += '<hr style="border:0;border-top:1px solid #1f3354;margin:10px 0"><div class="sub">' + T("BRIBE FOR:") + ' <b style="color:#fff">' + esc(debate.title) + '</b></div>' +
            (have ? '<div class="sub">' + T("Already offered:") + ' ' + fmt(have) + ' ' + T("credits") + ' (' + T("vote") + ' ' + esc(T(stance.toUpperCase())) + ')</div>' : "") +
            '<div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap">' +
            '<select id="b-stance" style="min-width:110px"' + (mine.length ? " disabled" : "") + '><option value="yes"' + (stance === "yes" ? " selected" : "") + '>' + T("buy a YES") + '</option><option value="no"' + (stance === "no" ? " selected" : "") + '>' + T("buy a NO") + '</option></select>' +
            '<select id="b-amount" style="min-width:110px"><option>100</option><option>250</option><option selected>500</option><option>1000</option><option>1500</option></select>' +
            '<button class="btn small" id="b-go">' + T("OFFER") + '</button></div><div class="sub" id="b-info" style="margin-top:6px"></div>';

    }
    else if (pr) { h += '<div class="sub" style="margin-top:8px">Bribes can only be offered while the selected proposal is in debate.</div>'; }
    else { h += '<div class="sub" style="margin-top:8px">Select a proposal in debate (PROPOSALS tab) to bribe this delegate.</div>'; }

    box.innerHTML = h + '</div>';

    /* the delegate's record: what they voted and how often they were bought */
    const histCard = document.createElement("div");
    histCard.className = "card";
    histCard.innerHTML = '<h3>' + esc(T("VOTING HISTORY")) + '</h3><div id="m-hist"></div>';
    box.appendChild(histCard);
    paintMemberHistory(m.id);
    loadMemberHistory(m.id);

    if (debate) {

        const info = function() {
            const add = Number($("b-amount").value);
            const total = have + add;
            const eff = Math.min(1, total / 1000 * (1 - m.loyalty / 100));
            $("b-info").innerHTML = T("Chance the bribe works:") + ' <b>' + Math.round(eff * 100) + '%</b> &middot; ' + T("risk of a scandal:") + ' <b>' +
                Math.min(95, Math.round(total / 100 * 5)) + '%</b>. ' + T("A bribe that fails is still lost.");
        };

        $("b-amount").addEventListener("change", info);
        info();

        $("b-go").addEventListener("click", async function() {
            const { data, error } = await supabaseClient.rpc("congress_bribe", {
                p_proposal: debate.id, p_member: m.id, p_amount: Number($("b-amount").value), p_stance: $("b-stance").value
            });
            if (error) { toast(error.message, true); return; }
            toast("Offer made (" + fmt(data.total) + " credits in total on this delegate).");
            await load();
        });

    }

}

/* ---------------------------------------------------------
   TABS
--------------------------------------------------------- */
function renderTabs() {

    const tabs = [["proposals", "PROPOSALS"], ["leader", "THE TWO CHAIRS"], ["party", "PARTY"], ["new", "NEW PROPOSAL"],
        ["propaganda", "PROPAGANDA"], ["occupied", "OCCUPIED WORLDS"], ["committees", "COMMITTEES"],
        ["authority", "AUTHORITY"], ["news", "NEWS"],
        ["front", "THE FRONT PAGE"], ["guide", "GUIDE"]];

    $("tabs").innerHTML = tabs.map(t => '<div class="tab' + (tab === t[0] ? " on" : "") + '" data-t="' + t[0] + '">' + t[1] + '</div>').join("");
    $("tabs").querySelectorAll(".tab").forEach(el => el.addEventListener("click", function() { tab = el.dataset.t; renderTabs(); }));

    const body = $("tabbody");

    if (tab === "proposals") { body.innerHTML = proposalsHtml(); wireProposals(); }
    else if (tab === "leader") { body.innerHTML = leaderHtml(); wireLeader(); }
    else if (tab === "party") { body.innerHTML = partyHtml(); wireParty(); }
    else if (tab === "new") { body.innerHTML = newHtml(); wireNew(); }
    else if (tab === "propaganda") { body.innerHTML = propagandaHtml(); wirePropaganda(); }
    else if (tab === "occupied") { body.innerHTML = occupiedHtml(); wireOccupied(); }
    else if (tab === "authority") { body.innerHTML = authorityHtml(); wireAuthority(); }
    else if (tab === "committees") { body.innerHTML = governmentHtml(); wireGovernment(); }
    else if (tab === "front") { body.innerHTML = frontHtml(); wireFront(); }
    else if (tab === "guide") { body.innerHTML = guideHtml(); wireGuide(); }
    else { body.innerHTML = ov.log.map(l => '<div class="log"><time>' + new Date(l.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + '</time>' + esc(l.text) + '</div>').join("") || '<div class="sub">Nothing has happened yet.</div>'; }

}

/* ---------------------------------------------------------
   THE GUIDE (2026-11-17)

   Eight steps, each opening the tab it is about, remembered per
   browser so a player comes back to where they stopped.
--------------------------------------------------------- */

const GUIDE_STEPS = [
    { t: "THE CHAMBER", go: "proposals",
      b: "Every delegate seated in this dome is one vote. A bill needs a majority, and a few kinds need a supermajority. Bringing a bill never costs credits; what the bill does may." },
    { t: "A PARTY, NOT A LONE VOICE", go: "party",
      b: "Join a party in PARTY. Delegates lean with their party, the party with the most seats chairs the committees, and only a party's members may report its committee's bills." },
    { t: "PROPOSING", go: "new",
      b: "In NEW PROPOSAL you bring a bill yourself, of any kind the chamber allows. If you hold no seat the factions still bring their own every few minutes." },
    { t: "THE DOME", go: "proposals",
      b: "While a bill is live the dome moves: delegates are swayed by the debate, the standing of the parties and the Authority's popularity. Green seats are yes, red are no." },
    { t: "THE VOTE", go: "proposals",
      b: "At the vote a bill passes or fails, and a bill that passes is carried out at once: a war declared, a fleet authorised, credits moved." },
    { t: "TWO CHAIRS, NOT ONE", go: "leader",
      b: "The President leads the Freedom Authority and is elected by its players. The Speaker leads this chamber and holds the veto. Two people, two elections." },
    { t: "COMMITTEES AND MINISTERS", go: "committees",
      b: "Three committees schedule the bills. The party in a chair may send one of its own bills straight to the vote, once a term. The President names three ministers, each of whom may act once a term." },
    { t: "WORLDS YOU HOLD", go: "occupied",
      b: "A conquered world is administered on OCCUPIED WORLDS: relief raises its stability, unrest rises while no fleet of ours is in its orbit, and at a hundred it throws the occupation off." }
];

let guideStep = 0;

function guideRead() {
    try { return JSON.parse(localStorage.getItem("gf_guide_congress") || "{}"); } catch (e) { return {}; }
}

function guideWrite(v) {
    try { localStorage.setItem("gf_guide_congress", JSON.stringify(v)); } catch (e) { /* private mode */ }
}

function guideHtml() {

    const saved = guideRead();

    if (typeof saved.step === "number") {
        guideStep = Math.max(0, Math.min(GUIDE_STEPS.length - 1, saved.step));
    }

    const step = GUIDE_STEPS[guideStep];

    let h = '<div class="card"><h3>' + T("GUIDE") + ' &middot; ' + (guideStep + 1) + ' / ' + GUIDE_STEPS.length + '</h3>' +
        '<div class="sub">' + T("Eight steps through the Congress. Each one opens the tab it is about; come back here for the next.") + '</div>' +
        '<div style="margin:9px 0;display:flex;gap:5px;flex-wrap:wrap">' +
        GUIDE_STEPS.map((s, i) => '<span class="rchip' + (i === guideStep ? " on" : "") + '">' + (i + 1) + '</span>').join("") +
        '</div>' +
        '<h3 style="margin:12px 0 5px">' + T(step.t) + '</h3>' +
        '<div class="sub">' + esc(T(step.b)) + '</div>' +
        '<div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">' +
        (guideStep > 0 ? '<button class="btn small" id="guide-back">' + T("GUIDE BACK") + '</button>' : "") +
        '<button class="btn small" id="guide-go">' + T("GUIDE GO THERE") + '</button>' +
        '<button class="btn small" id="guide-next">' + T(guideStep < GUIDE_STEPS.length - 1 ? "GUIDE NEXT" : "GUIDE FINISH") + '</button>' +
        '</div></div>';

    if (guideStep === GUIDE_STEPS.length - 1) {
        h += '<div class="card"><h3>' + T("THAT IS THE CONGRESS") + '</h3><div class="sub">' +
            T("Everything the chamber does is on these tabs, and taking part costs nothing: no credits to propose, no credits to vote. The record of it all is on NEWS.") +
            '</div></div>';
    }

    return h;

}

function wireGuide() {

    const go = $("guide-go");
    const next = $("guide-next");
    const back = $("guide-back");

    if (go) {
        go.addEventListener("click", function() {
            tab = GUIDE_STEPS[guideStep].go;
            renderTabs();
        });
    }

    if (next) {
        next.addEventListener("click", function() {
            guideStep = Math.min(GUIDE_STEPS.length - 1, guideStep + 1);
            guideWrite({ step: guideStep, done: guideStep === GUIDE_STEPS.length - 1 });
            renderTabs();
        });
    }

    if (back) {
        back.addEventListener("click", function() {
            guideStep = Math.max(0, guideStep - 1);
            guideWrite({ step: guideStep });
            renderTabs();
        });
    }

}

}

/* ---- proposals ---- */
function proposalsHtml() {

    const note = '<div class="sub" style="margin-bottom:10px">Congress sits only while a Freedom Authority player is online. The delegates bring proposals of their own every few minutes.</div>';

    if (!ov.proposals.length) { return note + '<div class="sub">Congress has no proposals yet. Write one in NEW PROPOSAL, or wait for the delegates.</div>'; }

    return note + ov.proposals.map(function(p) {

        const t = TYPES[p.type] || { name: p.type, votes: "majority" };
        const spons = factionById(p.sponsor);
        const live = p.status === "introduction" || p.status === "debate";
        const need = t.votes === "supermajority" ? ov.supermajority : ov.majority;

        let h = '<div class="card' + (p.mine ? " mine" : "") + (live ? " active" : "") + (selProposal === p.id ? " sel" : "") + '" data-p="' + p.id + '">' +
            '<h3>' + esc(p.title) + '</h3>' +
            '<div class="sub"><span class="badge ' + (p.status === "passed" ? "pass" : live ? "live" : "fail") + '">' + esc(T(p.status === "failed_funds" ? "NO FUNDS" : p.status.toUpperCase())) + '</span>' +
            (p.by_president ? '<span class="badge live">' + esc(T("PRESIDENTIAL")) + '</span>' : "") +
            esc(T(t.votes)) + ' &middot; ' + T("free") + ' &middot; ' + T("by") + ' ' + esc(p.proposer) +
            ' &middot; ' + T("spoken for by") + ' <span style="color:' + esc(spons.color) + '">' + esc(spons.name) + '</span></div>';

        if (live) {

            /* cg_resolve carries the first fleet and pushes the next four, so the
               bars and the expected count show the odds the vote will really use */
            const fleets = propState ? Number(propState.fleets) : NaN;
            const fleetRule = p.type === "fleet_construction" && Number.isFinite(fleets) && fleets < 5;

            const secs = p.status === "introduction" ? secondsLeft(p.debate_at) : secondsLeft(p.vote_at);
            h += '<div class="sub" style="margin:6px 0"><b class="cd" data-p="' + p.id + '" data-s="' + p.status + '"' +
                ' data-intro="' + esc(T("Debate opens in")) + '" data-vote="' + esc(T("Vote in")) + '" style="color:#ffd37a">' +
                (p.status === "introduction" ? T("Debate opens in") : T("Vote in")) + ' ' + mmss(secs) + '</b> &middot; ' +
                T("needs") + ' ' + need + ' ' + T("of") + ' ' + ov.seats + ' ' + T("votes") + '</div>';

            if (fleetRule) {
                h += '<div class="sub" style="color:#7dff9d">' + esc(T(fleets === 0
                    ? "GUARANTEED: the Authority has no fleet, so every delegate votes yes."
                    : "These bars already include the opening fleet rule.")) + '</div>';
            }

            const dv = liveDebateFor(p.id);

            if (dv) {

                /* the chamber as it stands: every delegate has taken a side */
                let yesN = 0, noN = 0, undN = 0;

                for (const f of ov.factions) {

                    const d = (dv.factions || {})[String(f.id)] || { yes: 0, no: 0, undecided: 0 };
                    const total = Math.max(1, d.yes + d.no + d.undecided);
                    const share = Math.round(d.yes / total * 100);

                    yesN += d.yes; noN += d.no; undN += d.undecided;

                    h += '<div class="fc"><span class="nm">' + esc(f.name) + '</span><div class="bar"><i style="width:' + share + '%;background:' + esc(f.color) + '"></i></div><span>' + d.yes + '/' + total + '</span></div>';
                }

                h += '<div class="sub"><b style="color:' + (yesN >= need ? "#7dff9d" : "#ff8a8a") + '">' + T("YES") + ' ' + yesN + '</b> &middot; ' +
                    T("NO") + ' ' + noN + ' &middot; ' + T("UNDECIDED") + ' ' + undN + ' &middot; ' + T("the floor is still moving") + '</div>';

            }
            else {

                let expected = 0;
                for (const fc of (p.forecast || [])) {
                    const f = factionById(fc.faction);
                    const chance = fleetRule ? (fleets === 0 ? 100 : Math.min(100, fc.p + 35)) : fc.p;
                    expected += f.seats * chance / 100;
                    h += '<div class="fc"><span class="nm">' + esc(f.name) + '</span><div class="bar"><i style="width:' + chance + '%;background:' + esc(f.color) + '"></i></div><span>' + chance + '%</span></div>';
                }
                h += '<div class="sub">' + T("Forecast: about") + ' <b style="color:' + (expected >= need ? "#7dff9d" : "#ff8a8a") + '">' + Math.round(expected) + '</b> ' +
                    T("yes votes (chance of a YES per faction, before bribes and surprises).") + '</div>';

            }

            if (p.bribes.length) {
                h += '<div class="sub" style="margin-top:4px">' + T("Your bribes:") + ' ' + p.bribes.length + ' (' + fmt(p.bribes.reduce((n, b) => n + b.amount, 0)) + ' ' + T("credits") + ')</div>';
            }

            h += '<div style="margin-top:8px"><button class="btn small sel-btn" data-p="' + p.id + '">' + T(selProposal === p.id ? "SELECTED FOR BRIBES" : "SELECT TO BRIBE DELEGATES") + '</button>' +
                (typeof speaker !== "undefined" && speaker && speaker.speaker && speaker.speaker.me &&
                    !speaker.speaker.veto_used && !p.mine
                    ? ' <button class="btn small red veto-btn" data-p="' + p.id + '">' + T("VETO") + '</button>' : "") + '</div>';

        }
        else {

            const tot = Math.max(1, (p.yes || 0) + (p.no || 0) + (p.abstain || 0));
            h += '<div style="display:flex;height:11px;margin:8px 0 3px;background:#14223a"><i style="width:' + (p.yes / tot * 100) + '%;background:#2fbf6a"></i><i style="width:' + (p.no / tot * 100) + '%;background:#c44"></i><i style="width:' + (p.abstain / tot * 100) + '%;background:#667"></i></div>' +
                '<div class="sub">' + T("YES") + ' ' + p.yes + ' &middot; ' + T("NO") + ' ' + p.no + ' &middot; ' + T("ABSTAIN") + ' ' + p.abstain +
                (p.required ? ' &middot; ' + T("needed") + ' ' + p.required : '') + '</div>';

            if (p.result) {
                if (p.result.effect) { h += '<div style="margin-top:6px;font-size:12px;color:#cfe3ff">' + esc(p.result.effect) + '</div>'; }
                for (const d of p.result.defections || []) { h += '<div class="sub">' + T("Defection:") + ' ' + esc(d) + '</div>'; }
                for (const r of p.result.removed || []) { h += '<div class="sub" style="color:#ff9a7a">' + T("Scandal:") + ' ' + esc(r) + '</div>'; }
            }

        }

        return h + '</div>';

    }).join("");

}

function wireProposals() {
    $("tabbody").querySelectorAll(".veto-btn").forEach(el => el.addEventListener("click", async function() {
        const ok = await gameConfirm("Use your veto on this proposal? You can only veto once per term.", "Notice");
        if (!ok) { return; }
        const { error } = await supabaseClient.rpc("congress_speaker_veto", { p_proposal: Number(el.dataset.p) });
        if (error) { toast(error.message, true); return; }
        toast(T("Vetoed."));
        await load();
    }));
    $("tabbody").querySelectorAll(".sel-btn").forEach(el => el.addEventListener("click", function() {
        selProposal = Number(el.dataset.p);
        render();
    }));
}

/* ---- the Congress Leader: the player the players elected ---- */
function leaderHtml() {

    const pres = ov.president;
    const el = ov.election;
    const myParty = ov.my_party;

    let h = '<div class="card"><h3>' + T("PRESIDENT OF THE FREEDOM AUTHORITY") + '</h3>' +
        '<div class="sub">' + T("The faction's leader") + ' &middot; ' + T("elected by the players, for a two week term") + '</div>';

/* ---- mini map of the galaxy (planet positions are % of the galaxy map) ---- */
const OWNER_COLORS = { "Freedom Authority": "#4a8cff", "Combine": "#ff4a4a", "Independents": "#e6e6e6" };

/* a capital is cored by its faction and never enters an occupation book; the
   list is here too, so a leftover row cannot show up on this tab */
const CAPITAL_WORLDS = ["Ultramars", "Free Earth"];

function isCapitalWorld(name) {
    const n = String(name == null ? "" : name).trim().toLowerCase();
    return CAPITAL_WORLDS.some(c => c.toLowerCase() === n);
}

function miniMapHtml(kind) {

    const W = 480, H = 270;
    const occ = {};
    for (const o of (ov.occupations || [])) {
        if (isCapitalWorld(o.planet)) { continue; }
        occ[o.planet] = o;
    }
    const declared = new Set(ov.authorizations.war);
    const targets = new Set(ov.targets.map(t => t.planet));
    const stageCols = ["#d6a84b", "#4cc2ff", "#7a8cff", "#5bff9a"];

    let svg = '<svg class="minimap" viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;background:#050a14;border:1px solid #1f3354;display:block">';

    for (let gx = 1; gx < 10; gx++) { svg += '<line x1="' + gx * W / 10 + '" y1="0" x2="' + gx * W / 10 + '" y2="' + H + '" stroke="#0d1830"/>'; }
    for (let gy = 1; gy < 6; gy++) { svg += '<line x1="0" y1="' + gy * H / 6 + '" x2="' + W + '" y2="' + gy * H / 6 + '" stroke="#0d1830"/>'; }

    for (const p of ov.planets || []) {

        const x = p.x / 100 * W;
        const y = p.y / 100 * H;
        const col = OWNER_COLORS[p.owner] || "#778";
        const o = occ[p.name];

        let dim = false;
        let ring = "";
        let label = "";

        if (kind === "war") {
            dim = !targets.has(p.name) && !declared.has(p.name) && p.owner !== "Freedom Authority";
            if (declared.has(p.name)) { ring = '<circle cx="' + x + '" cy="' + y + '" r="9" fill="none" stroke="#ff4a4a" stroke-width="2"/><path d="M' + (x - 12) + ' ' + y + ' H' + (x + 12) + ' M' + x + ' ' + (y - 12) + ' V' + (y + 12) + '" stroke="#ff4a4a" stroke-width="1.5"/>'; label = "WAR"; }
            else if (targets.has(p.name)) { ring = '<circle cx="' + x + '" cy="' + y + '" r="8" fill="none" stroke="' + (warTarget === p.name ? "#ffd24c" : "#6f87aa") + '" stroke-width="' + (warTarget === p.name ? 3 : 1.5) + '"/>'; }
            if (o) { ring += '<circle cx="' + x + '" cy="' + y + '" r="12" fill="none" stroke="#4cc2ff" stroke-dasharray="2 2"/>'; }
        }
        else {
            dim = !o;
            if (o) { ring = '<circle cx="' + x + '" cy="' + y + '" r="10" fill="none" stroke="' + stageCols[o.stage] + '" stroke-width="3"/>'; label = (o.stage + 1) + "/4"; }
        }

        svg += '<g class="mm-p" data-p="' + esc(p.name) + '" style="cursor:' + ((kind === "war" && targets.has(p.name)) || (kind !== "war" && o) ? "pointer" : "default") + '">' +
            '<circle cx="' + x + '" cy="' + y + '" r="4" fill="' + col + '" opacity="' + (dim ? 0.25 : 1) + '"/>' + ring +
            (label ? '<text x="' + x + '" y="' + (y - 15) + '" text-anchor="middle" fill="#fff" font-size="9" font-weight="800">' + label + '</text>' : "") +
            ((kind === "war" ? (targets.has(p.name) || declared.has(p.name)) : !!o) ? '<text x="' + x + '" y="' + (y + 20) + '" text-anchor="middle" fill="#b9cae3" font-size="9">' + esc(p.name) + '</text>' : "") +
            '</g>';

    }

    svg += '</svg><div class="sub" style="margin-top:4px">' +
        (kind === "war"
            ? '<span style="color:#ffd24c">&#9711;</span> chosen target &middot; <span style="color:#ff4a4a">&#10010;</span> war declared &middot; blue = Authority, red = Combine, white = independent worlds'
            : 'Ring colour = occupation stage (gold occupied, light blue civilian administration, violet protected, green integrated)') + '</div>';

    return svg;

}

function propagandaHtml() {

    const cd = (propState && Number(propState.cooldown)) || 600;

    let h = '<div class="sub" style="margin-bottom:10px">Propaganda is paid from the Authority treasury. A campaign raises the loyalty of a faction\'s delegates and can pull delegates of other factions over to it. The same faction can be targeted once every ten minutes.</div>';

    if (!propState) {
        if (propError) {
            return h + '<div class="card"><h3>The propaganda offices are not installed</h3>' +

                '<div class="sub" style="margin-top:6px;color:#ff8a8a">' + esc(propError) + '</div></div>';
        }
        return h + '<div class="sub">Loading the propaganda offices...</div>';
    }

    const credits = Number(propState.credits || 0);
    const amounts = [1000, 2500, 5000, 10000];

    h += '<div class="card"><h3>The propaganda offices</h3>' +
        '<div class="sub">TREASURY <b style="color:#fff">' + fmt(credits) + ' credits</b></div>' +
        '<div class="sub" style="margin-top:4px">A campaign lifts the loyalty of the faction\'s own delegates and wins over the least loyal delegates of the others (they join it, at its level of loyalty). More money means more points and more delegates.</div></div>';

    h += ov.factions.map(function(f) {

        const info = (propState.factions || {})[String(f.id)] || {};
        const until = info.last_at ? new Date(new Date(info.last_at).getTime() + cd * 1000).toISOString() : null;
        const busy = until ? secondsLeft(until) > 0 : false;

        let card = '<div class="card"><h3><span class="dot" style="background:' + esc(f.color) + '"></span> ' + esc(f.name) + '</h3>' +
            '<div class="sub">' + f.seats + ' ' + T("delegates") + ' &middot; ' + f.loyalty + '% ' + T("loyalty") +
            (info.runs ? ' &middot; ' + info.runs + ' ' + T(Number(info.runs) === 1 ? "campaign" : "campaigns") + ' &middot; ' + fmt(info.spent) + ' ' + T("credits spent") : '') + '</div>' +
            '<div class="bar" style="margin-top:5px"><i style="width:' + Math.max(0, Math.min(100, f.loyalty)) + '%;background:' + esc(f.color) + '"></i></div>';

        if (busy) {
            card += '<div class="sub" style="margin-top:7px;color:#ffd37a">A campaign for this faction is still running: <b class="prop-cd" data-until="' + esc(until) + '">' + mmss(secondsLeft(until)) + '</b></div>';
        }

        card += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">' + amounts.map(function(a) {
            const off = busy || credits < a;
            return '<button class="btn small prop-btn" data-f="' + f.id + '" data-amt="' + a + '"' + (off ? " disabled" : "") + '>' + T("CAMPAIGN") + ' ' + fmt(a) + '</button>';
        }).join("") + '</div>';

        return card + '</div>';

    }).join("");

    return h;

}

/* ---- occupied worlds ---- */

/* how much a taken world resents it (its own book, so the Congress's own
   overview is untouched) */
function unrestFor(planet) {
    const list = (typeof unrest !== "undefined" && unrest && unrest.worlds) ? unrest.worlds : [];
    const found = list.find(w => w.planet === planet);
    return found || null;
}

/* the terms the clock adds to the bar every turn, in the order it adds them,
   and the one-off a saboteur left behind before the world was even taken */
const FEED_LABELS = {
    occupation: "the occupation itself",
    relief: "stability bought with relief",
    policy: "the policy in force",
    fleet: "no fleet of ours in orbit",
    tax: "the tax"
};

function feedsLine(u) {

    const feeds = (u && u.feeds) || [];
    const live = feeds.filter(f => f.key !== "planted" && Number(f.value));
    const planted = feeds.find(f => f.key === "planted");

    if (!live.length && !(planted && Number(planted.value))) { return ""; }

    const parts = live.map(function(f) {
        const v = Number(f.value);
        return '<span>' + T(FEED_LABELS[f.key] || f.key) + '</span> <b style="color:' + (v > 0 ? "#ff5a4a" : "#4cc2ff") + '">' +
            (v > 0 ? "+" : "\u2212") + Math.abs(v) + '</b>';
    });

    if (planted && Number(planted.value)) {
        parts.push('<span>' + T("planted trouble") + '</span> <b style="color:#ff9a3c">+' + Number(planted.value) + '</b> ' +
            '<span>' + T("(already in the bar)") + '</span>');
    }

    return '<div class="sub" style="margin-top:4px"><b>' + T("WHAT FEEDS IT") + ':</b> ' + parts.join(" &middot; ") + '</div>';

}

/* the two answers to a world that is climbing: money, and the troops */
function rebelsLine(u) {

    if (!u) { return ""; }

    const calm = u.calm || {};
    const fight = u.fight || {};
    const bands = Number(fight.bands != null ? fight.bands : (fight.rebels ? 1 : 0));
    const men = Number(fight.men || 0);

    /* a militia company is five hundred men: the band is only its strength */
    const companies = Math.max(0, Math.ceil(men / 500));
    const calmWait = Number(calm.ready_in) || 0;
    const fightWait = Number(fight.ready_in) || 0;
    const armed = bands > 0;
    const canFight = armed && !!fight.garrison && fightWait <= 0;

    /* the recruits the camps took out of the garrison: men over the bands' own
       size, which an ignored revolt keeps adding to */
    const bandBase = Number(typeof rebelBase === "undefined" ? 0 : rebelBase) || 0;
    const recruits = armed && bandBase > 0 ? Math.max(0, men - bands * bandBase) : 0;

    let why;

    if (!armed) { why = T("No rebel band has risen here yet: that takes unrest 60."); }
    else if (!fight.garrison) { why = T("The militia is under arms, and no fleet of ours is in orbit to send against them."); }
    else if (fightWait > 0) { why = T("The troops are regrouping: ready in") + " " + fightWait + " s."; }
    else { why = T("Send the troops into the woods: they will break the militia, at a price in soldiers."); }

    return '<div class="sub" style="margin-top:6px"><b>' + T("REBEL MILITIA") + ':</b> ' +
        (armed ? bands + ' ' + T(bands === 1 ? "band" : "bands") + ' &middot; ' +
                 companies + ' ' + T(companies === 1 ? "militia company" : "militia companies") + ' &middot; ' +
                 Number(men).toLocaleString() + ' ' + T("men") +
                 (recruits > 0 ? ' &middot; ' + Number(recruits).toLocaleString() + ' ' +
                     T("recruits from the garrison") : "")
               : T("none")) + '</div>' +
        '<div style="margin-top:6px"><button class="btn small calm-world" data-p="' + esc(u.planet) + '"' +
        (calmWait > 0 || armed ? " disabled" : "") + '>' + T("CALM THE WORLD") + ' (' + Number(calm.price || 0) + ')</button> ' +
        '<button class="btn small fight-rebels" data-p="' + esc(u.planet) + '"' + (canFight ? "" : " disabled") + '>' +
        T("FIGHT THE MILITIA") + '</button></div>' +
        '<div class="sub">' + why +
        (armed ? " " + T("They must be broken before the world can be calmed.") : "") +
        (calmWait > 0 && !armed ? " " + T("The ringleaders will take money again in") + " " + calmWait + " s." : "") + '</div>';

}

function unrestLine(planet) {

    const u = unrestFor(planet);

    if (!u) { return ""; }

    const value = Math.round(Number(u.unrest) || 0);
    const colour = value >= 80 ? "#ff5a4a" : value >= 55 ? "#ff9a3c" : value >= 30 ? "#d6a84b" : "#4cc2ff";

    return '<div class="sub" style="margin-top:6px">' + T("UNREST") + ' ' + value + ' / 100 &middot; <b style="color:' + colour + '">' +
        T(u.mood) + '</b>' + (Number(u.revolts) ? ' &middot; ' + T("revolts") + ' ' + u.revolts : '') + '</div>' +
        '<div class="bar"><i style="width:' + value + '%;background:' + colour + '"></i></div>' +
        feedsLine(u) +
        '<div class="sub">' + T("Unrest climbs on a world that was taken by force. It eats the world's stability, and at a hundred the world rises and throws the occupation off.") + '</div>' +
        rebelsLine(u) +
        policyLine(planet);

}

/* ---------------------------------------------------------
   COMMITTEES AND MINISTERS (2026-11-15)
--------------------------------------------------------- */

let gov = null;
let govError = null;

/* what a ministry's holder did this term, in the player's language. The rule
   is the holder's own loyalty and his party's standing: nobody presses this,
   the chamber's man acts on his own once a term. */
function ministryEffectLine(m) {

    const e = m.effect;

    if (!e || !e.kind) { return T("Has not acted this term."); }

    if (e.kind === "fleet") { return T("Authorised a fleet with no bill: build it from the galaxy map."); }

    if (e.kind === "levy") {
        return T("Took an extraordinary levy:") + " " + Number(e.credits || 0).toLocaleString() + " " +
            T("credits") + ", " + T("and the people were told.");
    }

    if (e.kind === "relief") {
        return T("Sent relief to") + " " + esc(e.planet) + ": " + T("stability") + " " +
            Number(e.stability || 0) + ".";
    }

    if (e.kind === "idle") {
        if (e.reason === "party") { return T("Nothing: the holder's party is in disgrace and will not serve this term."); }
        if (e.reason === "holder") { return T("Nothing: the holder is too sullen to act this term."); }
        return T("Nothing to do: every world we administer is already settled.");
    }

    return "";
}

const COMMITTEE_LABEL = { fleets: "COMMITTEE OF FLEETS", treasury: "COMMITTEE OF THE TREASURY", diplomacy: "COMMITTEE OF DIPLOMACY" };
const POST_LABEL = { war: "WAR", treasury: "TREASURY", interior: "INTERIOR" };

/* which file puts right what the screen just failed on. "Run 2026-11-15" was
   the answer to everything, including the failure that file cannot fix: the
   party book had no loyalty column, and that is 2026-11-22. */
function missingPatchAdvice(message) {

    const m = String(message || "");

    if (/loyalty does not exist/i.test(m)) {
        return T("The party book is missing a column. Run sql/2026-11-22_the_party_book_has_a_loyalty.sql, then reload this page.");
    }

    if (/seats does not exist/i.test(m)) {
        return T("This database still has an earlier version of the committee functions. Run sql/2026-11-15_committees_and_ministers.sql again: it replaces them.");
    }

    if (/does not exist/i.test(m)) {
        return T("A table or column this screen needs is missing. Run sql/2026-11-15_committees_and_ministers.sql, then sql/2026-11-20_the_ministries_belong_to_the_chamber.sql, then sql/2026-11-22_the_party_book_has_a_loyalty.sql.");
    }

    return T("Run sql/2026-11-15_committees_and_ministers.sql, then reload this page.");
}

function governmentHtml() {

    if (!gov) {

        /* "run the patch" is the wrong advice for the one failure that means the
           patch is only half applied: the database still has the earlier
           committee functions, and running the file again replaces them */
        return '<div class="card"><h3>' + T("COMMITTEES AND MINISTERS") + '</h3><div class="sub">' +
            missingPatchAdvice(govError) +
            (govError ? '<br><br><b style="color:#ff8a8a">' + esc(govError) + '</b>' : '') + '</div></div>';

    }

    let h = '<div class="card"><h3>' + T("THE COMMITTEES") + '</h3><div class="sub">' +
        T("The chair may report one bill of the committee's own kind straight to the vote, once a term and ten minutes apart at the least. Nowhere else does a seat count for anything but a vote.") + '</div>';

    (gov.committees || []).forEach(function(c) {

        h += '<div style="border-left:4px solid ' + esc(c.chair_color || "#888") + ';background:rgba(255,255,255,.04);margin:8px 0;padding:8px 10px;">' +
            '<div style="font-weight:bold;color:#fff;">' + T(COMMITTEE_LABEL[c.kind] || c.name) + '</div>' +
            '<div class="sub">' + T("Chaired by") + ' <b>' + esc(c.chair_name || "?") + '</b> (' + Number(c.chair_seats || 0) + ' ' + T("seats") + ')</div>' +
            ((c.bills || []).length
                ? c.bills.map(function(b) {
                      return '<div class="sub" style="margin-top:4px"><b>' + esc(b.title) + '</b> &middot; ' +
                          (c.mine
                              ? (Number(c.wait) > 0
                                  ? T("reports in") + " " + mmss(Number(c.wait))
                                  : '<button class="btn small report" data-p="' + b.id + '">' + T("REPORT TO THE VOTE") + '</button>')
                              : esc(b.status)) + '</div>';
                  }).join("")
                : '<div class="sub">' + T("No bill of this committee's kind is before the chamber.") + '</div>') + '</div>';
    });

    h += '</div><div class="card"><h3>' + T("THE MINISTRIES") + '</h3><div class="sub">' +
        T("The ministries are the chamber's, and no delegate holds two: the party with the most seats fills them with its most loyal delegates, and the President may name each holder himself. Each holder acts on his own once a term, more boldly when he is loyal and his party is in favour and less when it is not. A party below 25 loyalty is not served at all.") + '</div>';

    /* the President names them; with the office empty the Authority's own
       players do, which is what makes the picker live rather than a dead row */
    const mayPick = gov.is_president === true || !gov.president;

    (gov.ministers || []).forEach(function(m) {

        h += '<div style="border-left:4px solid ' + esc(m.party_color || "#7fdcff") + ';background:rgba(255,255,255,.04);margin:8px 0;padding:8px 10px;">' +
            '<div style="font-weight:bold;color:#fff;">' + T(POST_LABEL[m.post] || m.post) + '</div>' +
            '<div class="sub">' + (m.holder
                ? esc(m.holder) + ' &middot; ' + esc(m.party_name || "?") +
                  (m.loyalty == null ? "" : ' &middot; ' + T("loyalty") + ' ' + Math.round(Number(m.loyalty)))
                : T("No minister")) + '</div>' +
            '<div class="sub" style="margin-top:4px">' + ministryEffectLine(m) + '</div>';

        /* who holds it. The chamber's own choice is the first entry, so a post
           left alone stays automatic; the leader may overrule it. */
        h += '<div style="margin-top:6px">' +
            '<select class="pick" data-post="' + esc(m.post) + '"' + (mayPick ? "" : " disabled") + '>' +
            '<option value="">' + T("— THE CHAMBER'S CHOICE —") + '</option>' +
            (gov.delegates || []).map(function(d) {
                return '<option value="' + esc(d.id) + '"' +
                    (Number(m.member) === Number(d.id) ? " selected" : "") + '>' +
                    esc(d.name) + ' &middot; ' + esc(d.party_name || "?") + ' &middot; ' +
                    Math.round(Number(d.loyalty || 0)) + '</option>';
            }).join("") + '</select>' +
            (mayPick ? "" : '<div class="sub" style="margin-top:4px">' +
                T("The President of the Freedom Authority names the ministers. While the office is empty, any Freedom Authority player may.") + '</div>') +
            '</div>';

        h += '</div>';
    });

    return h + '</div>';

}

function wireGovernment() {

    $("tabbody").querySelectorAll(".report").forEach(el => el.addEventListener("click", async function() {
        el.disabled = true;
        const { error } = await supabaseClient.rpc("cg_committee_report", { p_proposal: Number(el.dataset.p) });
        if (error) { toast(error.message, true); el.disabled = false; return; }
        toast(T("REPORT TO THE VOTE"));
        await load();
    }));

    /* the only control is the President's picker: who holds the post. What
       the post then does is the holder's own business, once a term */
    $("tabbody").querySelectorAll(".pick").forEach(el => el.addEventListener("change", async function() {
        const { error } = await supabaseClient.rpc("cg_assign_ministry", {
            p_post: el.dataset.post,
            p_member: el.value ? Number(el.value) : null
        });
        if (error) { toast(error.message, true); return; }
        toast(T("THE MINISTRY"));
        await load();
    }));

}

/* ---------------------------------------------------------
   HOW THE WORLD IS ADMINISTERED (2026-11-13)
--------------------------------------------------------- */

/* civil rule pays what the world always paid, reprisals half again and
   amnesty half; a world nobody has decided about is under civil rule */
const POLICY_LABELS = { civil: "CIVIL RULE", reprisals: "REPRISALS", amnesty: "AMNESTY" };

function policyLine(planet) {

    const u = unrestFor(planet);
    const policy = (u && u.policy) || "civil";
    const g = (u && u.garrison) || { fleets: 0, soldiers: 0 };

    return '<div class="sub" style="margin-top:8px"><b>' + T("POLICY") + ':</b> ' + T(POLICY_LABELS[policy] || "CIVIL RULE") +
        ' &middot; ' + (Number(g.fleets) > 0
            ? T("GARRISON") + ' ' + g.fleets + ' (' + Number(g.soldiers || 0).toLocaleString() + ')'
            : T("NO GARRISON")) + '</div>' +
        '<div style="margin-top:4px">' + Object.keys(POLICY_LABELS).map(function(k) {
            return '<button class="btn small policy" data-p="' + esc(planet) + '" data-k="' + k + '"' +
                (k === policy ? " disabled" : "") + '>' + T(POLICY_LABELS[k]) + '</button>';
        }).join(" ") + '</div>' +
        '<div class="sub">' + T("How a world we hold whole is administered. Civil rule pays what the world always paid; reprisals pay half again its income and make its people angrier; amnesty pays half and lets them settle.") +
        ' ' + T("Unrest climbs two points a turn faster while no fleet of ours stands in this world's orbit.") + '</div>';

}

function occupiedHtml() {

    const occupied = (ov.occupations || []).filter(o => !isCapitalWorld(o.planet));

    if (!occupied.length) {
        return '<div class="sub">The Authority holds no occupied worlds. When Freedom Authority fleets conquer every city of a planet, it is placed under occupation and moves through four stages: <b>occupied</b>, <b>civilian administration</b>, <b>protected</b> and finally <b>integrated</b>. Each stage takes time and enough stability (relief proposals raise it), and each earns the planet delegates in Congress.</div>';
    }

    const names = ["OCCUPIED", "CIVILIAN ADMIN", "PROTECTED", "INTEGRATED"];

    return '<div class="card">' + miniMapHtml("occupied") + '</div>' + occupied.map(function(o) {

        return '<div class="card"><h3>' + esc(o.planet) + '</h3><div class="sub">' + esc(o.stage_name) + ' &middot; ' + o.seats + ' ' + T("of") + ' ' + o.seats_target + ' ' + T("delegates seated") + '</div>' +
            '<div class="steps">' + names.map((n, i) => '<div class="' + (i < o.stage ? "done" : i === o.stage ? "cur" : "") + '">' + T(n) + '</div>').join("") + '</div>' +
            unrestLine(o.planet) +
            '<div class="sub">' + T("STABILITY") + ' ' + o.stability + ' / ' + T("needed") + ' ' + (o.stage < 3 ? o.threshold : "-") + '</div>' +
            '<div class="bar"><i style="width:' + o.stability + '%;background:' + (o.stability >= o.threshold ? "#2fbf6a" : "#d6a84b") + '"></i></div>' +
            (o.stage < 3 ? '<div class="sub">' + T("STAGE PROGRESS") + ' ' + o.progress + ' / ' + o.duration + ' ' + T("turns (5 minutes each, only counted while stability is high enough)") + '</div>' +
                '<div class="bar"><i style="width:' + (o.duration ? o.progress / o.duration * 100 : 0) + '%;background:#4cc2ff"></i></div>' : '<div class="sub" style="color:#7dff9d">Fully integrated into the Authority: the world has sent two more delegates to Congress.</div>') +
            '<div style="margin-top:8px"><button class="btn small relief" data-p="' + esc(o.planet) + '">' + T("PROPOSE RELIEF (+10 stability)") + '</button></div></div>';

    }).join("");

}

function wireOccupied() {
    $("tabbody").querySelectorAll(".mm-p").forEach(el => el.addEventListener("click", function() {
        const o = ov.occupations.find(x => x.planet === el.dataset.p);
        if (o) { draft.type = "resource_allocation"; draft.planet = o.planet; toast("Relief for " + o.planet + ": press PROPOSE RELIEF on its card."); }
    }));
    $("tabbody").querySelectorAll(".relief").forEach(el => el.addEventListener("click", function() {
        draft.type = "resource_allocation"; draft.planet = el.dataset.p; tab = "new"; renderTabs();
    }));
    $("tabbody").querySelectorAll(".calm-world").forEach(el => el.addEventListener("click", async function() {
        const planet = el.dataset.p;
        el.disabled = true;
        const { data, error } = await supabaseClient.rpc("unrest_calm", { p_planet: planet });
        if (error) { toast(error.message, true); await load(); return; }
        toast(planet + ": " + T("The world is calmer: unrest -20.") + " " + fmt(data.credits) + " " + T("credits left."));
        await load();
    }));
    $("tabbody").querySelectorAll(".fight-rebels").forEach(el => el.addEventListener("click", async function() {
        const planet = el.dataset.p;
        if (!window.confirm(T("Send the troops against the militia in ") + planet + T("? The militia will lose men, and so will the fleet."))) { return; }
        el.disabled = true;
        const { data, error } = await supabaseClient.rpc("unrest_fight", { p_planet: planet });
        if (error) { toast(error.message, true); await load(); return; }
        toast(planet + ": " + T("The rebels are beaten down.") + " " + data.killed + " " + T("militia dead,") + " " +
            data.lost + " " + T("soldiers lost,") + " " + T("bands left:") + " " + data.bands + ".");
        await load();
    }));
    $("tabbody").querySelectorAll(".policy").forEach(el => el.addEventListener("click", async function() {
        el.disabled = true;
        const { error } = await supabaseClient.rpc("occupation_set_policy", { p_planet: el.dataset.p, p_policy: el.dataset.k });
        if (error) { toast(error.message, true); el.disabled = false; return; }
        toast(el.dataset.p + ": " + T("POLICY") + " " + T(POLICY_LABELS[el.dataset.k]));
        await load();
    }));
}

/* ---- authority ---- */
function authorityHtml() {

    const a = ov.authorizations;
    const rel = ov.state.relations || {};
    const declaredWar = new Set(a.war);
    const target = ov.targets.find(t => t.planet === warTarget);

    let h = '<div class="tokens">' +
        '<div class="token">AUTHORISED FLEETS<b>' + a.fleet + '</b><span class="sub">build from the galaxy map</span></div>' +
        '<div class="token">AUTHORISED KNIGHTMARE SQUADS<b>' + a.knightmare + '</b><span class="sub">recruit into a fleet</span></div>' +
        '<div class="token">WAR DECLARATIONS<b>' + a.war.length + '</b><span class="sub">' + (a.war.length ? esc(a.war.join(", ")) : "none") + '</span></div></div>';

    h += '<div class="card active"><h3>War room: declare war on a planet</h3>' +
        '<div class="sub" style="margin-bottom:8px">Only players write a Declaration of War (the delegates never do); Congress then votes on it, and a majority is enough. Without a passed declaration Freedom Authority fleets cannot attack a planet. Click a planet on the map.</div>' +
        miniMapHtml("war") +
        '<div style="margin-top:8px;font-size:13px">' + (target ? T("Target:") + ' <b style="color:#ffd24c">' + esc(target.planet) + '</b> (' + T("held by") + ' ' + esc(target.owners) + ')' : T("No target chosen yet.")) + '</div>' +
        '<label class="row">WHICH FACTION SPEAKS FOR IT?</label><div class="spons">' +
        ov.factions.map(f => '<div class="opt' + (draft.sponsor === f.key ? " on" : "") + '" data-k="' + f.key + '"><span class="dot" style="background:' + esc(f.color) + '"></span> <b>' + esc(f.name) + '</b> (' + f.seats + ')' +
            '<small>' + ((f.priorities || []).indexOf("military_action") !== -1 ? "&#9733; " + T("war is one of their priorities") : T("not a priority for them")) + '</small></div>').join("") + '</div>' +
        '<div style="margin-top:10px"><button class="btn" id="war-go"' + (target && !declaredWar.has(target.planet) ? "" : " disabled") + '>' + T("PROPOSE WAR") + '</button></div>' +
        '</div>';

    h += '<div class="card"><h3>Standing</h3><div class="sub">' + T("POPULARITY") + ' ' + Math.round(ov.state.popularity) + '% ' +
        T("(it shifts every vote by up to \u00b110 points: a popular Authority gets its way more often)") + '</div>' +
        '<div class="bar"><i style="width:' + ov.state.popularity + '%;background:#4cc2ff"></i></div>' +
        '<div class="sub" style="margin-top:8px">' + T("TAX LEVEL") + ' ' + ov.state.tax_level + ' ' + T("of") + ' 2 &middot; ' + T("relations:") +
        ' Combine ' + (rel.Combine || 0) + ' / 100</div>' +
        '<div class="sub" style="margin-top:4px">' + T("Every world we hold resents the top tax level: two more points of unrest a turn.") + '</div>' +
        '<div style="margin-top:8px"><button class="btn small" id="tax-down"' + (Number(ov.state.tax_level) > 0 ? "" : " disabled") + '>' +
        T("LOWER THE TAX — 1 LEVEL") + '</button> <span class="sub">' + T("it costs nothing and the people are grateful (+5 popularity).") + '</span></div></div>';

    h += '<div class="card"><h3>The four factions</h3>' + ov.factions.map(f =>
        '<div class="sub" style="padding:4px 0"><span class="dot" style="background:' + esc(f.color) + '"></span> <b style="color:#fff">' + esc(f.name) + '</b> (' + f.seats + ' ' + T("seats") + '): ' + esc(f.description) + '</div>').join("") + '</div>';

    return h;

}

function wireAuthority() {

    $("tabbody").querySelectorAll(".mm-p").forEach(el => el.addEventListener("click", function() {
        if (ov.targets.some(t => t.planet === el.dataset.p)) { warTarget = el.dataset.p; renderTabs(); }
    }));

    $("tabbody").querySelectorAll(".spons .opt").forEach(el => el.addEventListener("click", function() { draft.sponsor = el.dataset.k; renderTabs(); }));

    if ($("tax-down")) {
        $("tax-down").addEventListener("click", async function() {
            $("tax-down").disabled = true;
            const { error } = await supabaseClient.rpc("cg_tax_cut");
            if (error) { toast(error.message, true); return; }
            toast(T("The tax is one level lower."));
            await load();
        });
    }

    if ($("war-go")) {
        $("war-go").addEventListener("click", async function() {
            $("war-go").disabled = true;
            const { error } = await supabaseClient.rpc("congress_submit", { p_type: "military_action", p_planet: warTarget, p_fleet: null, p_target: null, p_sponsor: draft.sponsor });
            if (error) { toast(error.message, true); $("war-go").disabled = false; return; }
            toast("The Declaration of War is before Congress.");
            tab = "proposals";
            await load();
        });
    }

}

/* ---------------------------------------------------------
   TIMERS + REFRESH
--------------------------------------------------------- */
setInterval(function() {

    if (!ov) { return; }

    document.querySelectorAll(".cdt").forEach(function(el) { el.textContent = mmss(secondsLeft(el.dataset.ts)); });

    document.querySelectorAll(".prop-cd").forEach(function(el) { el.textContent = mmss(secondsLeft(el.dataset.until)); });

    document.querySelectorAll(".cd").forEach(function(el) {
        const p = ov.proposals.find(x => x.id === Number(el.dataset.p));
        if (!p) { return; }
        const intro = p.status === "introduction";
        const s = secondsLeft(intro ? p.debate_at : p.vote_at);
        el.textContent = (intro ? el.dataset.intro : el.dataset.vote) + " " + mmss(s);
        if (s === 0) { load(); }
    });

}, 1000);

setInterval(function() { if (document.visibilityState === "visible") { load(); } }, 9000);

load();
</script>
