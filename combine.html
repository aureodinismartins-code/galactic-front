<script>
/* =========================================================
   SUPREME SOVIET OF THE COMBINE (screen)
   Everything is decided by the server (2026-10-28_combine_soviet.sql);
   this page shows the plenum, sends directives and grants privileges.
========================================================= */

const TYPES = {
    military_campaign: { name: "Military Campaign against a Planet", votes: "majority", desc: "Authorise an attack on one planet. Without it Combine fleets cannot attack." },
    fleet_construction: { name: "New Fleet Quota", votes: "qualified", desc: "Raise the maximum by one fleet (build it from the galaxy map afterwards; it is still paid for there)." },
    knightmare_construction: { name: "Armoured Detachment", votes: "qualified", desc: "Approve one elite armoured detachment (the Knightmare Facility chain is still needed)." },
    production_quota: { name: "Five-Year Plan: Raise the Quota", votes: "qualified", desc: "Raise the production quota: 300-500 credits every 15 minutes per level (max 2), confidence -5." },
    fleet_revocation: { name: "Reassign and Dismantle a Fleet", votes: "qualified", desc: "Break up one Combine fleet for 500 credits of salvage." }
};

let ov = null;
let unrest = null;        /* how much every taken world resents it */

/* how many men a band is before it takes recruits (2026-11-40) */
let rebelBase = 0;
let tab = "directives";
let selMember = null;
let selDirective = null;
let currentFilter = null;
let warTarget = null;
let skew = 0;
let draft = { type: "fleet_construction", planet: "", fleet: "", target: "Freedom Authority", current: "" };
let positions = [];
let debate = null;
let debateError = null;
let propState = null;
let propError = null;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Number(n || 0).toLocaleString();
const T = s => (typeof window.t === "function" ? window.t(s) : s);

function toast(text, err) {
    const t = $("toast");
    t.textContent = text;
    t.className = err ? "err" : "";
    t.style.display = "block";
    clearTimeout(toast.h);
    toast.h = setTimeout(() => { t.style.display = "none"; }, 5200);
}

function secondsLeft(ts) { return Math.max(0, Math.round((new Date(ts).getTime() - (Date.now() + skew)) / 1000)); }
function mmss(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function currentById(id) { return (ov.currents || []).find(c => c.id === id) || { name: "?", color: "#888", priorities: [] }; }

/* ---------------------------------------------------------
   LOAD
--------------------------------------------------------- */
async function load() {

    /* the clock first: it may resolve a directive, seat a new Secretary,
       bring a directive of its own or pay the quota */
    await supabaseClient.rpc("cs_tick");

    const { data, error } = await supabaseClient.rpc("cs_overview");

    if (error) {
        $("tabbody").innerHTML = '<div class="card"><h3>The Supreme Soviet is not in session</h3><div class="sub">' +
            esc(error.message) + '<br><br>Only Combine players sit in the Soviet, and sql/2026-10-28_combine_soviet.sql must have been run.</div></div>';
        return;
    }

    ov = data;
    skew = new Date(ov.now).getTime() - Date.now();

    /* the unrest of the worlds the Union has taken */
    await supabaseClient.rpc("unrest_tick");
    const us = await supabaseClient.rpc("unrest_state");
    unrest = us.error ? null : us.data;

    /* the men a band holds before it recruits: what stands over that
       is blood the garrison has lost to the militia */
    const bandBase = await supabaseClient.rpc("rebel_band_size");
    rebelBase = bandBase && !bandBase.error && bandBase.data != null ? Number(bandBase.data) : 0;

    /* the committees and the ministries (2026-11-15). The error is kept, not
       swallowed, so the tab can say why it failed instead of only asking for
       the patch again */
    const gv = await supabaseClient.rpc("cs_government");
    gov = gv.error ? null : gv.data;
    govError = gv.error ? gv.error.message : null;

    const dr = await supabaseClient.rpc("cs_debate_view");
    debate = dr.error ? null : dr.data;
    debateError = dr.error ? dr.error.message : null;

    const pr = await supabaseClient.rpc("cs_agitprop_state");
    propState = pr.error ? null : pr.data;
    propError = pr.error ? pr.error.message : null;

    if (!draft.current) { draft.current = (ov.currents[0] && ov.currents[0].key) || "proletarian"; }
    if (!draft.planet && ov.targets.length) { draft.planet = ov.targets[0].planet; }
    if (!draft.fleet && ov.my_fleets.length) { draft.fleet = ov.my_fleets[0].id; }
    if (selDirective && !ov.directives.find(d => d.id === selDirective)) { selDirective = null; }

    render();

}

function render() {

    const sec = ov.president;
    $("st-pres").textContent = sec && sec.name ? sec.name : "vacant";
    $("st-pres").style.color = sec && sec.name ? currentById(sec.faction).color : "#b89598";
    $("st-credits").textContent = fmt(ov.credits);
    $("st-pop").textContent = Math.round(ov.state.popularity) + "%";
    $("st-quota").textContent = ov.state.tax_level + " / 2";

    /* the plan can come down as well as up: the plenum is always glad of it */
    const down = $("quota-down");

    if (down && !down.dataset.wired) {
        down.dataset.wired = "1";
        down.addEventListener("click", async function() {
            down.disabled = true;
            const { error } = await supabaseClient.rpc("cs_quota_cut");
            if (error) { toast(error.message, true); return; }
            toast(T("The tax level is one level lower."));
            await load();
        });
    }

    if (down) { down.disabled = Number(ov.state.tax_level) <= 1; }

    const fl = ov.fleets || { total: 0, max: 0, quotas: 0 };
    $("st-fleets").textContent = fl.total + " / " + fl.max;
    $("st-fleets").style.color = fl.quotas > 0 ? "#7dff9d" : "#fff";
    $("st-fleets").title = T("in service / the maximum the Soviet permits") + " (" + fl.quotas + " " + T("quota(s) waiting") + ")";

    $("st-seats").textContent = ov.seats;
    $("st-need").textContent = ov.majority + " / " + ov.supermajority;
    $("st-need").title = "votes needed: majority / three fifths";

    renderLegend();
    renderHemicycle();
    renderMember();
    renderTabs();

}

/* ---------------------------------------------------------
   THE PLENUM
--------------------------------------------------------- */
function liveDebateFor(id) {
    if (!debate || !debate.proposals) { return null; }
    return debate.proposals.find(x => x.id === id) || null;
}

function paintedDebate() {
    if (!debate || !debate.proposals || !debate.proposals.length) { return null; }
    return debate.proposals.find(x => x.id === selDirective) || debate.proposals[0];
}

function renderLegend() {

    const dv = paintedDebate();
    const dr = dv ? ov.directives.find(x => x.id === dv.id) : null;

    $("legend").innerHTML = ov.currents.map(c =>
        '<span class="chip fchip" data-f="' + c.id + '" style="cursor:pointer;' + (currentFilter === c.id ? "border-color:#fff;background:#5c1a1d;" : "") + '"><span class="dot" style="background:' + esc(c.color) + '"></span>' + esc(T(c.name)) + ' &middot; <b>' + c.seats + '</b> ' + T("seats") + ' &middot; ' + T("discipline") + ' ' + c.loyalty + '</span>'
    ).join("") + '<span class="chip"><span class="dot" style="background:transparent;border:2px dashed #ffd37a"></span>' + esc(T("under investigation")) + '</span>' +
    (dv ? '<span class="chip" style="border-color:#7dff9d"><span class="dot" style="background:transparent;border:2px solid #7dff9d"></span>' + esc(T("voting yes")) +
        '</span><span class="chip" style="border-color:#ff8a8a"><span class="dot" style="background:transparent;border:2px solid #ff8a8a"></span>' + esc(T("voting no")) +
        '</span><span class="chip">' + esc(T(dr ? dr.title : "")) + ' &middot; ' + T("YES") + ' ' + dv.yes + ' &middot; ' + T("NO") + ' ' + dv.no + ' &middot; ' + T("UNDECIDED") + ' ' + dv.undecided +
        '</span>' : "");

    $("legend").querySelectorAll(".fchip").forEach(el => el.addEventListener("click", function() {
        const id = Number(el.dataset.f);
        currentFilter = currentFilter === id ? null : id;
        renderLegend(); renderHemicycle();
    }));

}

/* seats on concentric half-rings, grouped by current */
function layoutSeats(n) {

    const rows = n > 120 ? 9 : 8;
    const r0 = 150, r1 = 360;
    const radii = [];
    for (let i = 0; i < rows; i++) { radii.push(r0 + (r1 - r0) * i / (rows - 1)); }
    const sum = radii.reduce((a, b) => a + b, 0);

    const counts = radii.map(r => Math.round(n * r / sum));
    let diff = n - counts.reduce((a, b) => a + b, 0);
    for (let i = rows - 1; diff !== 0; i = (i - 1 + rows) % rows) { counts[i] += diff > 0 ? 1 : -1; diff += diff > 0 ? -1 : 1; }

    const pts = [];

    radii.forEach(function(r, i) {
        for (let j = 0; j < counts[i]; j++) {
            const a = Math.PI - Math.PI * (j + 0.5) / counts[i];
            pts.push({ x: 380 + Math.cos(a) * r, y: 395 - Math.sin(a) * r, a: a, r: r });
        }
    });

    pts.sort((p, q) => (q.a - p.a) || (p.r - q.r));
    return pts;

}

function renderHemicycle() {

    const members = ov.commissars.slice().sort((a, b) => (a.faction - b.faction) || (a.seat - b.seat));

    if (positions.length !== members.length) { positions = layoutSeats(members.length); }

    const privileged = new Set();
    const dr = ov.directives.find(d => d.id === selDirective);
    if (dr) { for (const p of dr.privileges) { privileged.add(p.member); } }

    const painting = paintedDebate();

    let svg = '<path d="M20 395 A360 360 0 0 1 740 395" fill="none" stroke="#3a1417" stroke-width="1"/>';

    members.forEach(function(m, i) {

        const p = positions[i];
        const c = currentById(m.faction);
        const dim = currentFilter && m.faction !== currentFilter;

        svg += '<circle class="seat" data-i="' + i + '" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="7.4" fill="' + esc(c.color) + '" opacity="' + (dim ? 0.15 : 1) + '"' +
            (selMember === m.id ? ' stroke="#fff" stroke-width="3"' : m.suspect ? ' stroke="#ffd37a" stroke-width="2.2" stroke-dasharray="3 2"' : privileged.has(m.id) ? ' stroke="#7dff9d" stroke-width="2.5"' : '') + '/>';

        const side = painting && painting.sides ? painting.sides[String(m.id)] : null;

        if (side === "yes" || side === "no") {
            svg += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="10" fill="none" stroke="' +
                (side === "yes" ? "#7dff9d" : "#ff8a8a") + '" stroke-width="1.8" opacity="' + (dim ? 0.2 : 0.9) + '" pointer-events="none"/>';
        }

    });

    const sums = {};
    members.forEach(function(m, i) {
        sums[m.faction] = sums[m.faction] || { a: 0, n: 0 };
        sums[m.faction].a += positions[i].a; sums[m.faction].n++;
    });

    Object.keys(sums).forEach(function(k) {
        const c = currentById(Number(k));
        const a = sums[k].a / sums[k].n;
        /* the label is drawn inside the dome, so it is translated here */
        const rr = 388;
        const x = (380 + Math.cos(a) * rr).toFixed(1);
        const y = (395 - Math.sin(a) * rr).toFixed(1);
        const deg = (90 - a * 180 / Math.PI).toFixed(1);
        svg += '<text transform="translate(' + x + ',' + y + ') rotate(' + deg + ')" text-anchor="middle" ' +
            'fill="' + esc(c.color) + '" font-size="9.5" font-weight="800" letter-spacing="0.5" ' +
            'stroke="#0b0708" stroke-width="3" stroke-linejoin="round" paint-order="stroke">' +
            esc(T(c.name).toUpperCase()) + '</text>';
    });

    svg += '<text x="380" y="352" text-anchor="middle" fill="#e8c46a" font-size="15" letter-spacing="4" font-weight="800">SUPREME SOVIET</text>' +
        '<text x="380" y="372" text-anchor="middle" fill="#b89598" font-size="11" letter-spacing="2">' + ov.seats + ' COMMISSARS</text>';

    $("hemi").innerHTML = svg;

    $("hemi").querySelectorAll(".seat").forEach(function(el) {
        const m = members[Number(el.dataset.i)];
        el.addEventListener("click", function() { selMember = m.id; render(); });
        el.addEventListener("mousemove", function(ev) {
            const c = currentById(m.faction);
            const t = $("tip");
            t.style.display = "block";
            t.style.left = (ev.clientX + 14) + "px";
            t.style.top = (ev.clientY + 14) + "px";
            t.innerHTML = '<b>' + esc(m.name) + '</b><br><span style="color:' + esc(c.color) + '">' + esc(c.name) + '</span><br>' +
                esc(m.region + ", seat " + m.seat) + '<br>' + T("Discipline") + ' ' + m.loyalty + (m.suspect ? "<br>" + T("Under investigation") : "");
        });
        el.addEventListener("mouseleave", function() { $("tip").style.display = "none"; });
    });

}

/* ---------------------------------------------------------
   A COMMISSAR
--------------------------------------------------------- */
let memberHistory = {};

async function loadMemberHistory(id) {

    const known = memberHistory[id];
    if (known && known.loading) { return; }
    if (known && (known.votes || known.error) && Date.now() - (known.at || 0) < 120000) { return; }

    memberHistory[id] = { loading: true };

    const { data, error } = await supabaseClient.rpc("cs_commissar_history", { p_commissar: id });

    memberHistory[id] = error ? { error: error.message, at: Date.now() } : Object.assign({ at: Date.now() }, data);
    paintMemberHistory(id);

}

function paintMemberHistory(id) {

    const box = $("m-hist");
    if (!box || selMember !== id) { return; }

    const rec = memberHistory[id];

    if (!rec || rec.loading) {
        box.innerHTML = '<div class="sub">' + esc(T("Loading the voting record...")) + '</div>';
        return;
    }

    if (rec.error) {
        box.innerHTML = '<div class="sub">' + esc(rec.error) + '</div>';
        return;
    }

    const rows = rec.votes || [];

    let h = '<div class="sub">' + T("YES") + ' ' + rec.yes + ' &middot; ' + T("NO") + ' ' + rec.no + ' &middot; ' +
        T("ABSTAIN") + ' ' + rec.abstain + ' &middot; ' + T("privileges taken:") + ' ' + rec.bribed + '</div>';

    if (!rows.length) {
        box.innerHTML = h + '<div class="sub" style="margin-top:6px">' + esc(T("This commissar has not voted yet.")) + '</div>';
        return;
    }

    h += rows.map(function(v) {
        const word = v.vote === "yes" ? T("YES") : v.vote === "no" ? T("NO") : T("ABSTAIN");
        const colour = v.vote === "yes" ? "#7dff9d" : v.vote === "no" ? "#ff8a8a" : "#b89598";
        return '<div class="log"><b style="color:' + colour + '">' + esc(word) + '</b>' +
            (v.bribed ? ' <span class="badge live">' + esc(T("PRIVILEGED")) + '</span>' : "") +
            ' ' + esc(T(v.title)) + '</div>';
    }).join("");

    box.innerHTML = h;

}

function renderMember() {

    const box = $("member");
    const m = ov.commissars.find(x => x.id === selMember);

    if (!m) {
        box.innerHTML = '<div class="sub" style="padding:10px 0">' + esc(T("Click a commissar to see who they are. While a directive is debated you can grant them cadre privileges.")) + '</div>';
        return;
    }

    const c = currentById(m.faction);
    const dr = ov.directives.find(d => d.id === selDirective);
    const live = dr && (dr.status === "introduction" || dr.status === "debate") ? dr : null;
    const debateOpen = dr && dr.status === "debate" ? dr : null;

    let mine = [];
    let have = 0;

    let h = '<div class="card"><h3><span class="dot" style="background:' + esc(c.color) + '"></span> ' + esc(m.name) + '</h3>' +
        '<div class="sub">' + esc(T(c.name)) + ' &middot; ' + esc(m.region) + ', ' + T("seat") + ' ' + m.seat + '</div>' +
        '<div class="sub" style="margin-top:6px">' + T("DISCIPLINE") + ' ' + m.loyalty + '%</div><div class="bar"><i style="width:' + m.loyalty + '%;background:' + esc(c.color) + '"></i></div>' +
        (m.suspect ? '<div class="sub" style="color:#ffd37a">' + esc(T("Under investigation for corruption.")) + '</div>' : "");

    if (debateOpen) {

        mine = debateOpen.privileges.filter(p => p.member === m.id);
        have = mine.reduce((n, p) => n + Number(p.amount), 0);
        const stance = mine.length ? mine[0].stance : "yes";

        h += '<hr class="rule"><div class="sub">' + T("PRIVILEGES FOR:") + ' <b style="color:#fff">' + esc(T(debateOpen.title)) + '</b></div>' +
            (have ? '<div class="sub">' + T("Already granted:") + ' ' + fmt(have) + ' ' + T("credits") + ' (' + T("vote") + ' ' + esc(T(stance.toUpperCase())) + ')</div>' : "") +
            '<div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap">' +
            '<select id="b-stance" style="min-width:110px"' + (mine.length ? " disabled" : "") + '><option value="yes"' + (stance === "yes" ? " selected" : "") + '>' + T("privileges for a YES") + '</option><option value="no"' + (stance === "no" ? " selected" : "") + '>' + T("privileges for a NO") + '</option></select>' +
            '<select id="b-amount" style="min-width:110px"><option>100</option><option>250</option><option selected>500</option><option>1000</option><option>1500</option></select>' +
            '<button class="btn small" id="b-go">' + T("GRANT") + '</button></div><div class="sub" id="b-info" style="margin-top:6px"></div>';

    }
    else if (live) {
        h += '<div class="sub" style="margin-top:8px">' + esc(T("Cadre privileges can be granted once the debate opens.")) + '</div>';
    }
    else if (dr) {
        h += '<div class="sub" style="margin-top:8px">' + esc(T("This directive is no longer open.")) + '</div>';
    }
    else {
        h += '<div class="sub" style="margin-top:8px">' + esc(T("Select a directive in debate (DIRECTIVES tab) to grant this commissar cadre privileges.")) + '</div>';
    }

    box.innerHTML = h + '</div>';

    const histCard = document.createElement("div");
    histCard.className = "card";
    histCard.innerHTML = '<h3>' + esc(T("VOTING HISTORY")) + '</h3><div id="m-hist"></div>';
    box.appendChild(histCard);
    paintMemberHistory(m.id);
    loadMemberHistory(m.id);

    if (debateOpen) {

        const info = function() {
            const add = Number($("b-amount").value);
            const total = have + add;
            const eff = Math.min(1, total / 1000 * (1 - m.loyalty / 100));
            $("b-info").innerHTML = T("Chance the privileges change the vote:") + ' <b>' + Math.round(eff * 100) + '%</b> &middot; ' +
                T("risk of a scandal:") + ' <b>' + Math.min(95, Math.round(total / 100 * 5)) + '%</b>. ' + T("A grant that fails is still spent.");
        };

        $("b-amount").addEventListener("change", info);
        info();

        $("b-go").addEventListener("click", async function() {
            const { data, error } = await supabaseClient.rpc("cs_privilege", {
                p_directive: debateOpen.id, p_commissar: m.id, p_amount: Number($("b-amount").value), p_stance: $("b-stance").value
            });
            if (error) { toast(error.message, true); return; }
            toast(T("Privileges granted:") + " " + fmt(data.total) + " " + T("credits in total on this commissar."));
            await load();
        });

    }

}

/* ---------------------------------------------------------
   TABS
--------------------------------------------------------- */
function renderTabs() {

    const tabs = [["directives", "DIRECTIVES"], ["secretary", "HIGH COMMISSAR"], ["party", "PARTY"], ["new", "NEW DIRECTIVE"],
        ["propaganda", "AGITPROP"], ["worlds", "OCCUPIED WORLDS"], ["committees", "COMMITTEES"],
        ["authority", "SOVIET POWER"], ["news", "NEWS"],
        ["front", "THE FRONT PAGE"], ["guide", "GUIDE"]];

    $("tabs").innerHTML = tabs.map(t => '<div class="tab' + (tab === t[0] ? " on" : "") + '" data-t="' + t[0] + '">' + esc(T(t[1])) + '</div>').join("");
    $("tabs").querySelectorAll(".tab").forEach(el => el.addEventListener("click", function() { tab = el.dataset.t; renderTabs(); }));

    const body = $("tabbody");

    if (tab === "directives") { body.innerHTML = directivesHtml(); wireDirectives(); }
    else if (tab === "secretary") { body.innerHTML = secretaryHtml(); wireSecretary(); }
    else if (tab === "party") { body.innerHTML = partyHtml(); wireParty(); }
    else if (tab === "new") { body.innerHTML = newHtml(); wireNew(); }
    else if (tab === "propaganda") { body.innerHTML = agitpropHtml(); wireAgitprop(); }
    else if (tab === "worlds") { body.innerHTML = worldsHtml(); wireWorlds(); }
    else if (tab === "authority") { body.innerHTML = authorityHtml(); wireAuthority(); }
    else if (tab === "committees") { body.innerHTML = governmentHtml(); wireGovernment(); }
    else if (tab === "front") { body.innerHTML = frontHtml(); wireFront(); }
    else if (tab === "guide") { body.innerHTML = guideHtml(); wireGuide(); }
    else { body.innerHTML = newsHtml(); }

}

/* ---------------------------------------------------------
   THE GUIDE (2026-11-17)

   Eight steps, each opening the tab it is about, remembered per
   browser so a player comes back to where they stopped.
--------------------------------------------------------- */

const GUIDE_STEPS = [
    { t: "THE PLENUM", go: "directives",
      b: "Every commissar in this hall is one vote, and a directive needs a qualified majority of the plenum. Putting one forward never costs credits; carrying it out may." },
    { t: "A CURRENT, NOT A LONE VOICE", go: "party",
      b: "Join a current in PARTY: the Proletarian Vanguard, the Party Apparatus, Red Command. The greatest current chairs the committees." },
    { t: "DIRECTIVES", go: "new",
      b: "In NEW DIRECTIVE you bring one yourself. The currents bring their own as well, and the plenum sits only while a Combine player is online." },
    { t: "THE SHOW OF HANDS", go: "directives",
      b: "While a directive is live the hall moves: the Soviet's confidence and its relations with the other side decide how the commissars lean, and the debate pulls them further." },
    { t: "THE VOTE", go: "directives",
      b: "A carried directive is executed at once: a campaign authorised, a quota raised, a fleet ordered or struck from the rolls." },
    { t: "TWO CHAIRS", go: "secretary",
      b: "The High Commissar leads the Combine and is elected by its players. The Secretary presides over the plenum and holds the veto. Two offices, two elections." },
    { t: "COMMITTEES AND MINISTERS", go: "committees",
      b: "Three committees schedule the directives, and the current in a chair may report one straight to the vote once a term. The High Commissar names the ministers." },
    { t: "WORLDS TAKEN", go: "worlds",
      b: "A world the Combine pacifies is administered on OCCUPIED WORLDS, and every world fully pacified sends one more commissar to this hall." }
];

let guideStep = 0;

function guideRead() {
    try { return JSON.parse(localStorage.getItem("gf_guide_combine") || "{}"); } catch (e) { return {}; }
}

function guideWrite(v) {
    try { localStorage.setItem("gf_guide_combine", JSON.stringify(v)); } catch (e) { /* private mode */ }
}

function guideHtml() {

    const saved = guideRead();

    if (typeof saved.step === "number") {
        guideStep = Math.max(0, Math.min(GUIDE_STEPS.length - 1, saved.step));
    }

    const step = GUIDE_STEPS[guideStep];

    let h = '<div class="card"><h3>' + esc(T("GUIDE")) + ' &middot; ' + (guideStep + 1) + ' / ' + GUIDE_STEPS.length + '</h3>' +
        '<div class="sub">' + esc(T("Eight steps through the Supreme Soviet. Each one opens the tab it is about; come back here for the next.")) + '</div>' +
        '<div style="margin:9px 0;display:flex;gap:5px;flex-wrap:wrap">' +
        GUIDE_STEPS.map((s, i) => '<span class="rchip' + (i === guideStep ? " on" : "") + '">' + (i + 1) + '</span>').join("") +
        '</div>' +
        '<h3 style="margin:12px 0 5px">' + esc(T(step.t)) + '</h3>' +
        '<div class="sub">' + esc(T(step.b)) + '</div>' +
        '<div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">' +
        (guideStep > 0 ? '<button class="btn small" id="guide-back">' + esc(T("GUIDE BACK")) + '</button>' : "") +
        '<button class="btn small" id="guide-go">' + esc(T("GUIDE GO THERE")) + '</button>' +
        '<button class="btn small" id="guide-next">' + esc(T(guideStep < GUIDE_STEPS.length - 1 ? "GUIDE NEXT" : "GUIDE FINISH")) + '</button>' +
        '</div></div>';

    if (guideStep === GUIDE_STEPS.length - 1) {
        h += '<div class="card"><h3>' + esc(T("THAT IS THE SOVIET")) + '</h3><div class="sub">' +
            esc(T("Everything the Combine does is on these tabs, and taking part costs nothing: no credits to propose, no credits to vote. The record of it all is on AGITPROP and NEWS.")) +
            '</div></div>';
    }

    return h;

}

function wireGuide() {

    const go = $("guide-go");
    const next = $("guide-next");
    const back = $("guide-back");

    if (go) {
        go.addEventListener("click", function() {
            tab = GUIDE_STEPS[guideStep].go;
            renderTabs();
        });
    }

    if (next) {
        next.addEventListener("click", function() {
            guideStep = Math.min(GUIDE_STEPS.length - 1, guideStep + 1);
            guideWrite({ step: guideStep, done: guideStep === GUIDE_STEPS.length - 1 });
            renderTabs();
        });
    }

    if (back) {
        back.addEventListener("click", function() {
            guideStep = Math.max(0, guideStep - 1);
            guideWrite({ step: guideStep });
            renderTabs();
        });
    }

}

/* ---- directives ---- */
function directivesHtml() {

    const note = '<div class="sub" style="margin-bottom:10px">' + esc(T("The Soviet sits only while a Combine player is online. Its commissars bring directives of their own every few minutes.")) + '</div>';

    if (!ov.directives.length) {
        return note + '<div class="sub">' + esc(T("The Soviet has no directives before it yet. Bring one in NEW DIRECTIVE, or wait for the commissars.")) + '</div>';
    }

    return note + ov.directives.map(function(d) {

        const t = TYPES[d.type] || { name: d.type, votes: "majority" };
        const spons = currentById(d.sponsor);
        const live = d.status === "introduction" || d.status === "debate";
        const need = d.required || (t.votes === "qualified" ? ov.supermajority : ov.majority);

        let h = '<div class="card' + (d.mine ? " mine" : "") + (live ? " active" : "") + (selDirective === d.id ? " sel" : "") + '" data-d="' + d.id + '">' +
            '<h3>' + esc(T(d.title)) + '</h3>' +
            '<div class="sub"><span class="badge ' + (d.status === "passed" ? "pass" : live ? "live" : "fail") + '">' + esc(T(d.status.toUpperCase())) + '</span>' +
            (d.by_secretary ? '<span class="badge live">' + esc(T("HIGH COMMISSAR")) + '</span>' : "") +
            esc(T(t.votes)) + ' &middot; ' + T("free") + ' &middot; ' + T("by") + ' ' + esc(T(d.proposer)) +
            ' &middot; ' + T("spoken for by") + ' <span style="color:' + esc(spons.color) + '">' + esc(T(spons.name)) + '</span></div>';

        if (live) {

            const secs = d.status === "introduction" ? secondsLeft(d.debate_at) : secondsLeft(d.vote_at);

            h += '<div class="sub" style="margin:6px 0"><b class="cd" data-d="' + d.id + '" data-s="' + d.status + '"' +
                ' data-intro="' + esc(T("Debate opens in")) + '" data-vote="' + esc(T("Vote in")) + '" style="color:#ffd37a">' +
                (d.status === "introduction" ? T("Debate opens in") : T("Vote in")) + ' ' + mmss(secs) + '</b> &middot; ' +
                T("needs") + ' ' + need + ' ' + T("of") + ' ' + ov.seats + ' ' + T("votes") + '</div>';

            if (d.type === "fleet_construction") {
                const fl = ov.fleets || { total: 0, max: 0 };
                h += '<div class="sub">' + T("FLEETS NOW:") + ' <b style="color:#fff">' + fl.total + ' / ' + fl.max + '</b> ' +
                    T("a YES raises the maximum to") + ' <b style="color:#7dff9d">' + (fl.max + 1) + '</b>.</div>';
            }

            const dv = liveDebateFor(d.id);

            if (dv) {

                let yesN = 0, noN = 0, undN = 0;

                for (const c of ov.currents) {

                    const g = (dv.factions || {})[String(c.id)] || { yes: 0, no: 0, undecided: 0 };
                    const total = Math.max(1, g.yes + g.no + g.undecided);
                    const share = Math.round(g.yes / total * 100);

                    yesN += g.yes; noN += g.no; undN += g.undecided;

                    h += '<div class="fc"><span class="nm">' + esc(T(c.name)) + '</span><div class="bar"><i style="width:' + share + '%;background:' + esc(c.color) + '"></i></div><span>' + g.yes + '/' + total + '</span></div>';
                }

                h += '<div class="sub"><b style="color:' + (yesN >= need ? "#7dff9d" : "#ff8a8a") + '">' + T("YES") + ' ' + yesN + '</b> &middot; ' +
                    T("NO") + ' ' + noN + ' &middot; ' + T("UNDECIDED") + ' ' + undN + ' &middot; ' + T("the plenum is still moving") + '</div>';

            }
            else {

                let expected = 0;
                for (const f of (d.forecast || [])) {
                    const c = currentById(f.faction);
                    const p = Number(f.p);
                    expected += c.seats * p / 100;
                    h += '<div class="fc"><span class="nm">' + esc(c.name) + '</span><div class="bar"><i style="width:' + p + '%;background:' + esc(c.color) + '"></i></div><span>' + p + '%</span></div>';
                }
                h += '<div class="sub">' + T("Forecast: about") + ' <b style="color:' + (expected >= need ? "#7dff9d" : "#ff8a8a") + '">' + Math.round(expected) + '</b> ' +
                    T("yes votes (chance of a YES per current, before privileges and surprises).") + '</div>';

            }

            if (d.privileges.length) {
                h += '<div class="sub" style="margin-top:4px">' + T("Your privileges:") + ' ' + d.privileges.length + ' (' +
                    fmt(d.privileges.reduce((n, p) => n + Number(p.amount), 0)) + ' ' + T("credits") + ')</div>';
            }

            h += '<div style="margin-top:8px"><button class="btn small sel-btn" data-d="' + d.id + '">' + T(selDirective === d.id ? "SELECTED FOR PRIVILEGES" : "SELECT TO GRANT PRIVILEGES") + '</button>' +
                (ov.president && ov.president.me && !ov.president.veto_used && !d.mine ? ' <button class="btn small gold veto-btn" data-d="' + d.id + '">' + T("VETO") + '</button>' : "") + '</div>';

        }
        else {

            const tot = Math.max(1, (d.yes || 0) + (d.no || 0) + (d.abstain || 0));
            h += '<div style="display:flex;height:11px;margin:8px 0 3px;background:#2a1618"><i style="width:' + (d.yes / tot * 100) + '%;background:#2fbf6a"></i><i style="width:' + (d.no / tot * 100) + '%;background:#c44"></i><i style="width:' + (d.abstain / tot * 100) + '%;background:#667"></i></div>' +
                '<div class="sub">' + T("YES") + ' ' + d.yes + ' &middot; ' + T("NO") + ' ' + d.no + ' &middot; ' + T("ABSTAIN") + ' ' + d.abstain +
                (d.required ? ' &middot; ' + T("needed") + ' ' + d.required : '') + '</div>';

            if (d.result) {
                if (d.result.effect) { h += '<div style="margin-top:6px;font-size:12px;color:#f3e7d2">' + esc(T(d.result.effect)) + '</div>'; }
                for (const x of d.result.defections || []) { h += '<div class="sub">' + T("Defection:") + ' ' + esc(x) + '</div>'; }
                for (const x of d.result.removed || []) { h += '<div class="sub" style="color:#ff9a7a">' + T("Scandal:") + ' ' + esc(x) + '</div>'; }
            }

        }

        return h + '</div>';

    }).join("");

}

function wireDirectives() {

    $("tabbody").querySelectorAll(".veto-btn").forEach(el => el.addEventListener("click", async function() {
        el.disabled = true;
        const { error } = await supabaseClient.rpc("cs_veto", { p_directive: Number(el.dataset.d) });
        if (error) { toast(error.message, true); el.disabled = false; return; }
        toast(T("Vetoed."));
        await load();
    }));

    $("tabbody").querySelectorAll(".sel-btn").forEach(el => el.addEventListener("click", function() {
        selDirective = Number(el.dataset.d);
        render();
    }));

}

/* a capital is cored by its faction, so it is never under occupation — not the
   Combine's own, not the Authority's. The list is here as well as in the
   database so a leftover row cannot put one on this tab. */
const CAPITAL_WORLDS = ["Ultramars", "Free Earth"];

function isCapitalWorld(name) {
    const n = String(name == null ? "" : name).trim().toLowerCase();
    return CAPITAL_WORLDS.some(c => c.toLowerCase() === n);
}

/* the galaxy, as the Congress draws it: planet_positions are percentages */
const MAP_COLORS = { "Freedom Authority": "#4a8cff", "Combine": "#ff4a4a", "Independents": "#e6e6e6" };

/* the four stages a world held whole passes through */
const STAGE_KEYS = ["OCCUPIED", "MILITARY ADMIN", "COLLECTIVISED", "INCORPORATED INTO THE UNION"];
const STAGE_COLORS = ["#d6a84b", "#4cc2ff", "#7a8cff", "#2fbf6a"];
const STAGE_NEED = [30, 40, 50, 100];
const STAGE_TURNS = 5;

function miniMapHtml(kind) {

    const W = 480, H = 270;
    const held = {};
    for (const w of (ov.worlds || [])) {
        if (isCapitalWorld(w.planet)) { continue; }
        held[w.planet] = w;
    }

    const declared = new Set(ov.authorizations.war || []);
    const liveCampaign = new Set(ov.directives.filter(d => d.type === "military_campaign" &&
        (d.status === "introduction" || d.status === "debate")).map(d => d.planet));
    const fronts = new Set((ov.targets || []).filter(t => t.owners !== "Combine" && t.owners !== "Unclaimed").map(t => t.planet));

    let svg = '<svg class="minimap" viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;background:#0b0708;border:1px solid #5a1d20;display:block">';

    for (let gx = 1; gx < 10; gx++) { svg += '<line x1="' + gx * W / 10 + '" y1="0" x2="' + gx * W / 10 + '" y2="' + H + '" stroke="#241012"/>'; }
    for (let gy = 1; gy < 6; gy++) { svg += '<line x1="0" y1="' + gy * H / 6 + '" x2="' + W + '" y2="' + gy * H / 6 + '" stroke="#241012"/>'; }

    for (const p of (ov.planets || [])) {

        const x = p.x / 100 * W;
        const y = p.y / 100 * H;
        const colour = MAP_COLORS[p.owner] || "#778";

        let dim = false;
        let ring = "";
        let label = "";
        let clickable = false;

        if (kind === "war") {

            clickable = fronts.has(p.name) && !declared.has(p.name);
            dim = !fronts.has(p.name) && !declared.has(p.name) && !liveCampaign.has(p.name);

            if (declared.has(p.name)) {
                ring = '<circle cx="' + x + '" cy="' + y + '" r="9" fill="none" stroke="#ff4a4a" stroke-width="2"/>' +
                    '<path d="M' + (x - 12) + ' ' + y + ' H' + (x + 12) + ' M' + x + ' ' + (y - 12) + ' V' + (y + 12) + '" stroke="#ff4a4a" stroke-width="1.5"/>';
                label = T("WAR");
            }
            else if (liveCampaign.has(p.name)) {
                ring = '<circle cx="' + x + '" cy="' + y + '" r="9" fill="none" stroke="#ffd37a" stroke-width="2" stroke-dasharray="3 2"/>';
                label = T("SOVIET");
            }
            else if (fronts.has(p.name)) {
                ring = '<circle cx="' + x + '" cy="' + y + '" r="8" fill="none" stroke="' + (draft.planet === p.name ? "#e8c46a" : "#7d5a5d") +
                    '" stroke-width="' + (draft.planet === p.name ? 3 : 1.5) + '"/>';
                if (draft.planet === p.name) { label = p.name; }
            }

        }
        else {

            const w = held[p.name];
            dim = !w;

            /* a whole world shows its administration stage (1/4 ... 4/4), the
               same convention as the Congress map; a contested one is dashed
               and has no stage yet */
            if (w) {

                const st = w.whole ? (w.stage == null ? 0 : Number(w.stage)) : null;

                ring = '<circle cx="' + x + '" cy="' + y + '" r="10" fill="none" stroke="' +
                    (st == null ? "#d6a84b" : STAGE_COLORS[st]) + '" stroke-width="3"' +
                    (st == null ? ' stroke-dasharray="3 2"' : '') + '/>';

                if (st != null) { label = (st + 1) + "/4"; }
            }

        }

        svg += '<g class="mm-p" data-p="' + esc(p.name) + '" style="cursor:' + (clickable ? "pointer" : "default") + '">' +
            '<circle cx="' + x + '" cy="' + y + '" r="4" fill="' + colour + '" opacity="' + (dim ? 0.25 : 1) + '"/>' + ring +
            (label ? '<text x="' + x + '" y="' + (y - 15) + '" text-anchor="middle" fill="#fff" font-size="9" font-weight="800">' + esc(label) + '</text>' : "") +
            (label && kind === "war" ? '<text x="' + x + '" y="' + (y + 20) + '" text-anchor="middle" fill="#c8a6a8" font-size="9">' + esc(p.name) + '</text>' : "") +
            '</g>';

    }

    svg += '</svg><div class="sub" style="margin-top:4px">' +
        (kind === "war"
            ? '<span style="color:#ff4a4a">&#10010;</span> ' + esc(T("campaign approved")) +
              ' &middot; <span style="color:#ffd37a">&#9711;</span> ' + esc(T("before the Soviet")) +
              ' &middot; <span style="color:#e8c46a">&#9711;</span> ' + esc(T("your target")) + ' &middot; ' +
              esc(T("click a planet to put a campaign against it before the Soviet")) +
              ' &middot; <span style="color:#ff4a4a">red</span> = ' + esc("Combine") + ', <span style="color:#4a8cff">blue</span> = ' + esc("Freedom Authority")
            : '<span style="color:#d6a84b">&#9711;</span> ' + esc(T("occupied")) +
              ' &middot; <span style="color:#4cc2ff">&#9711;</span> ' + esc(T("military administration")) +
              ' &middot; <span style="color:#7a8cff">&#9711;</span> ' + esc(T("collectivised")) +
              ' &middot; <span style="color:#2fbf6a">&#9711;</span> ' + esc(T("incorporated into the Union")) +
              ' &middot; ' + esc(T("dashed = contested, not yet a whole world"))) + '</div>';

    return svg;

}

/* how much a taken world resents it, read the same way the Authority's
   Congress reads it (policyLine and the bar both go through here) */
function unrestFor(planet) {
    const list = (typeof unrest !== "undefined" && unrest && unrest.worlds) ? unrest.worlds : [];

}

/* the terms the clock adds to the bar every turn, in the order it adds them,
   and the one-off a saboteur left behind before the world was even taken */
const FEED_LABELS = {
    occupation: "the occupation itself",
    relief: "stability bought with relief",
    policy: "the policy in force",
    fleet: "no fleet of ours in orbit",
    tax: "the tax"
};

function feedsLine(u) {

    const feeds = (u && u.feeds) || [];
    const live = feeds.filter(f => f.key !== "planted" && Number(f.value));
    const planted = feeds.find(f => f.key === "planted");

    if (!live.length && !(planted && Number(planted.value))) { return ""; }

    const parts = live.map(function(f) {
        const v = Number(f.value);
        return '<span>' + esc(T(FEED_LABELS[f.key] || f.key)) + '</span> <b style="color:' + (v > 0 ? "#ff5a4a" : "#4cc2ff") + '">' +
            (v > 0 ? "+" : "\u2212") + Math.abs(v) + '</b>';
    });

    if (planted && Number(planted.value)) {
        parts.push('<span>' + esc(T("planted trouble")) + '</span> <b style="color:#ff9a3c">+' + Number(planted.value) + '</b> ' +
            '<span>' + esc(T("(already in the bar)")) + '</span>');
    }

    return '<div class="sub" style="margin-top:4px"><b>' + esc(T("WHAT FEEDS IT")) + ':</b> ' + parts.join(" &middot; ") + '</div>';

}

/* the two answers to a world that is climbing: money, and the troops */
function rebelsLine(u) {

    if (!u) { return ""; }

    const calm = u.calm || {};
    const fight = u.fight || {};
    const bands = Number(fight.bands != null ? fight.bands : (fight.rebels ? 1 : 0));
    const men = Number(fight.men || 0);

    /* a militia company is five hundred men: the band is only its strength */
    const companies = Math.max(0, Math.ceil(men / 500));
    const calmWait = Number(calm.ready_in) || 0;
    const fightWait = Number(fight.ready_in) || 0;
    const armed = bands > 0;
    const canFight = armed && !!fight.garrison && fightWait <= 0;

    /* the recruits the camps took out of the garrison: men over the bands' own
       size, which an ignored revolt keeps adding to */
    const bandBase = Number(typeof rebelBase === "undefined" ? 0 : rebelBase) || 0;
    const recruits = armed && bandBase > 0 ? Math.max(0, men - bands * bandBase) : 0;

    let why;

    if (!armed) { why = esc(T("No rebel band has risen here yet: that takes unrest 60.")); }
    else if (!fight.garrison) { why = esc(T("The militia is under arms, and no fleet of ours is in orbit to send against them.")); }
    else if (fightWait > 0) { why = esc(T("The troops are regrouping: ready in")) + " " + fightWait + " s."; }
    else { why = esc(T("Send the troops into the woods: they will break the militia, at a price in soldiers.")); }

    return '<div class="sub" style="margin-top:6px"><b>' + esc(T("REBEL MILITIA")) + ':</b> ' +
        (armed ? bands + ' ' + esc(T(bands === 1 ? "band" : "bands")) + ' &middot; ' +
                 companies + ' ' + esc(T(companies === 1 ? "militia company" : "militia companies")) + ' &middot; ' +
                 Number(men).toLocaleString() + ' ' + esc(T("men")) +
                     (recruits > 0 ? ' &middot; ' + Number(recruits).toLocaleString() + ' ' +
                         esc(T("recruits from the garrison")) : "")
               : esc(T("none"))) + '</div>' +
        '<div style="margin-top:6px"><button class="btn small calm-world" data-p="' + esc(u.planet) + '"' +
        (calmWait > 0 || armed ? " disabled" : "") + '>' + esc(T("CALM THE WORLD")) + ' (' + Number(calm.price || 0) + ')</button> ' +
        '<button class="btn small fight-rebels" data-p="' + esc(u.planet) + '"' + (canFight ? "" : " disabled") + '>' +
        esc(T("FIGHT THE MILITIA")) + '</button></div>' +
        '<div class="sub">' + why +
        (armed ? " " + esc(T("They must be broken before the world can be calmed.")) : "") +
        (calmWait > 0 && !armed ? " " + esc(T("The ringleaders will take money again in")) + " " + calmWait + " s." : "") + '</div>';

}

function unrestLine(planet) {

    const list = (typeof unrest !== "undefined" && unrest && unrest.worlds) ? unrest.worlds : [];
    const u = list.find(x => x.planet === planet);

    if (!u) { return ""; }

    const value = Math.round(Number(u.unrest) || 0);
    const colour = value >= 80 ? "#ff5a4a" : value >= 55 ? "#ff9a3c" : value >= 30 ? "#d6a84b" : "#4cc2ff";

    return '<div class="sub" style="margin-top:6px">' + esc(T("UNREST")) + ' ' + value + ' / 100 &middot; <b style="color:' + colour + '">' +
        esc(T(u.mood)) + '</b>' + (Number(u.revolts) ? ' &middot; ' + esc(T("revolts")) + ' ' + u.revolts : '') + '</div>' +
        '<div class="bar"><i style="width:' + value + '%;background:' + colour + '"></i></div>' +
        feedsLine(u) +
        '<div class="sub">' + esc(T("Unrest climbs on a world that was taken by force. It eats the world's stability, and at a hundred the world rises and throws the occupation off.")) + '</div>' +
        rebelsLine(u) +
        policyLine(planet);

}

/* what a commissariat delivered this term, in the player's language. Nobody
   presses this: the holder acts on his own once a term, and how well he does
   is his own loyalty and his current's standing. */
function ministryEffectLine(m) {

    const e = m.effect;

    if (!e || !e.kind) { return T("Has not acted this term."); }

    if (e.kind === "fleet") { return T("Authorised a fleet with no bill: build it from the galaxy map."); }

    if (e.kind === "levy") {
        return T("Took an extraordinary levy:") + " " + Number(e.credits || 0).toLocaleString() + " " +
            T("credits") + ", " + T("and the people were told.");
    }

    if (e.kind === "relief") {
        return T("Sent relief to") + " " + esc(e.planet) + ": " + T("stability") + " " +
            Number(e.stability || 0) + ".";
    }

    if (e.kind === "idle") {
        if (e.reason === "party") { return T("Nothing: the holder's party is in disgrace and will not serve this term."); }
        if (e.reason === "holder") { return T("Nothing: the holder is too sullen to act this term."); }
        return T("Nothing to do: every world we administer is already settled.");
    }

    return "";
}

        esc(T("The commissariats are the plenum's, and no commissar holds two: the current with the most seats fills them with its most loyal commissars, and the High Commissar may name each holder himself. Each holder acts on his own once a term, harder when he is loyal and his current is in favour and less when it is not. A current below 25 loyalty is not served at all.")) + '</div>';

    /* the High Commissar names them; with the office empty the Combine's own
       players do, which is what makes the picker live rather than a dead row */
    const mayPick = gov.is_secretary === true || !gov.secretary;

    (gov.ministers || []).forEach(function(m) {

        h += '<div style="border-left:4px solid ' + esc(m.party_color || "#7fdcff") + ';background:rgba(255,255,255,.04);margin:8px 0;padding:8px 10px;">' +
            '<div style="font-weight:bold;color:#fff;">' + esc(T(POST_LABEL[m.post] || m.name || m.post)) + '</div>' +
            '<div class="sub">' + (m.holder
                ? esc(m.holder) + ' &middot; ' + esc(m.party_name || "?") +
                  (m.loyalty == null ? "" : ' &middot; ' + esc(T("loyalty")) + ' ' + Math.round(Number(m.loyalty)))
                : esc(T("No minister"))) + '</div>' +
            '<div class="sub" style="margin-top:4px">' + esc(ministryEffectLine(m)) + '</div>';

        /* who holds it. The plenum's own choice is the first entry, so a post
           left alone stays automatic; the High Commissar may overrule it. */
        h += '<div style="margin-top:6px">' +
            '<select class="pick" data-post="' + esc(m.post) + '"' + (mayPick ? "" : " disabled") + '>' +
            '<option value="">' + esc(T("— THE CHAMBER'S CHOICE —")) + '</option>' +
            (gov.delegates || []).map(function(d) {
                return '<option value="' + esc(d.id) + '"' +
                    (Number(m.member) === Number(d.id) ? " selected" : "") + '>' +
                    esc(d.name) + ' &middot; ' + esc(d.party_name || "?") + ' &middot; ' +
                    Math.round(Number(d.loyalty || 0)) + '</option>';
            }).join("") + '</select>' +
            (mayPick ? "" : '<div class="sub" style="margin-top:4px">' +
                esc(T("The High Commissar of the Combine names the commissars. While the office is empty, any Combine player may.")) + '</div>') +
            '</div>';

        h += '</div>';
    });

    return h + '</div>';

}

function wireGovernment() {

    $("tabbody").querySelectorAll(".report").forEach(el => el.addEventListener("click", async function() {
        el.disabled = true;
        const { error } = await supabaseClient.rpc("cs_committee_report", { p_directive: Number(el.dataset.p) });
        if (error) { toast(error.message, true); el.disabled = false; return; }
        toast(T("REPORT TO THE VOTE"));
        await load();
    }));

    /* the only control is the High Commissar's picker: who holds the post.
       What the post then does is the holder's own business, once a term */
    $("tabbody").querySelectorAll(".pick").forEach(el => el.addEventListener("change", async function() {
        const { error } = await supabaseClient.rpc("cs_assign_ministry", {
            p_post: el.dataset.post,

        });

}

/* ---- how the world is administered (2026-11-13) ---- */
const POLICY_LABELS = { civil: "CIVIL RULE", reprisals: "REPRISALS", amnesty: "AMNESTY" };

function policyLine(planet) {

    const u = unrestFor(planet);
    const policy = (u && u.policy) || "civil";
    const g = (u && u.garrison) || { fleets: 0, soldiers: 0 };

    return '<div class="sub" style="margin-top:8px"><b>' + esc(T("POLICY")) + ':</b> ' + esc(T(POLICY_LABELS[policy] || "CIVIL RULE")) +
        ' &middot; ' + (Number(g.fleets) > 0
            ? esc(T("GARRISON")) + ' ' + g.fleets + ' (' + Number(g.soldiers || 0).toLocaleString() + ')'
            : esc(T("NO GARRISON"))) + '</div>' +
        '<div style="margin-top:4px">' + Object.keys(POLICY_LABELS).map(function(k) {
            return '<button class="btn small policy-btn" data-p="' + esc(planet) + '" data-k="' + k + '"' +
                (k === policy ? " disabled" : "") + '>' + esc(T(POLICY_LABELS[k])) + '</button>';
        }).join(" ") + '</div>' +
        '<div class="sub">' + esc(T("How a world we hold whole is administered. Civil rule pays what the world always paid; reprisals pay half again its income and make its people angrier; amnesty pays half and lets them settle.")) +
        ' ' + esc(T("Unrest climbs two points a turn faster while no fleet of ours stands in this world's orbit.")) + '</div>';

}

/* ---- occupied worlds ---- */
function worldsHtml() {

    const worlds = (ov.worlds || []).filter(w => !isCapitalWorld(w.planet));

    /* nothing taken yet: the ministry carries the same note the Authority's
       occupied worlds tab carries, and no blank grid behind it */
    if (!worlds.length) {
        return '<div class="sub">' + esc(T("The Combine holds no occupied world. When Combine fleets take every city of a planet, it comes under Soviet administration and moves through four stages — occupied, military administration, collectivised and finally incorporated into the Union. Each stage takes time and enough stability (relief is a directive the Soviet votes on), and every world incorporated sends the Soviet one more commissar from that planet.")) + '</div>';
    }

    /* the shape the Authority's occupied tab has: one map, then one card per
       world, and nothing between them to read */
    const map = '<div class="card">' + miniMapHtml("held") + '</div>';

    return map + worlds.map(function(w) {

        const pct = w.total ? Math.round(w.held / w.total * 100) : 0;
        const stage = w.whole && w.stage != null ? Number(w.stage) : null;
        const need = stage == null ? 100 : (w.threshold != null ? Number(w.threshold) : STAGE_NEED[stage]);

        let actions = "";

        if (w.whole) {

            if (stage >= 3) {
                actions = '<div class="sub" style="color:#7dff9d">' + esc(T("Fully integrated into the Union: the plan collects this world, the Party has its confidence and the world has sent the Soviet one more commissar.")) + '</div>';
            }
            else {
                /* relief is a directive now: it goes before the Soviet and
                   waits for the vote, the way the Authority's does in Congress */
                actions = '<div style="margin-top:8px"><button class="btn small relief-btn" data-p="' + esc(w.planet) + '">' +
                    esc(T("PUT RELIEF TO THE SOVIET (+10 if it passes)")) + '</button></div>' +
                    '<div class="sub" style="margin-top:4px">' +
                    esc(T(Number(w.stability) >= need
                        ? "Stability is enough: the administration advances one turn every five minutes."
                        : "Stability is below the threshold: the administration does not advance until relief is sent.")) + '</div>';
            }

        }
        else if (w.declared) {
            actions = '<div class="sub" style="color:#7dff9d">' + esc(T("Campaign approved: the fleets may attack it.")) + '</div>';
        }
        else if (w.live) {
            actions = '<div class="sub" style="color:#ffd37a">' + esc(T("A campaign against it is before the Soviet.")) + '</div>';
        }
        else {
            actions = '<div style="margin-top:8px"><button class="btn small camp-btn" data-p="' + esc(w.planet) + '">' + esc(T("PUT A CAMPAIGN BEFORE THE SOVIET")) + '</button></div>';
        }

        return '<div class="card' + (w.whole ? "" : " active") + '"><h3>' + esc(w.planet) + ' ' +
            (w.whole && stage != null
                ? '<span class="badge pass">' + esc(T(STAGE_KEYS[stage])) + '</span>'
                : '<span class="badge live">' + esc(T("CONTESTED")) + '</span>') + '</h3>' +
            '<div class="sub">' + w.held + ' ' + T("of") + ' ' + w.total + ' ' + esc(T("cities held")) +
            (w.others ? ' &middot; ' + esc(T("also held by")) + ' ' + esc(w.others) : "") + '</div>' +
            '<div class="bar"><i style="width:' + pct + '%;background:' + (w.whole ? "#2fbf6a" : "#d6a84b") + '"></i></div>' +
            (stage != null
                ? '<div class="steps">' + STAGE_KEYS.map(function(n, i) {
                      return '<div class="' + (i < stage ? "done" : i === stage ? "cur" : "") + '">' + esc(T(n)) + '</div>';
                  }).join("") + '</div>' +
                  '<div class="sub">' + esc(T("STABILITY")) + ' ' + Math.round(w.stability) + ' / ' + esc(T("needed")) + ' ' + (stage < 3 ? need : "-") + '</div>' +
                  '<div class="bar"><i style="width:' + Math.min(100, Number(w.stability)) + '%;background:' +
                      (Number(w.stability) >= need ? "#2fbf6a" : "#d6a84b") + '"></i></div>' +
                  unrestLine(w.planet) +
                  (stage < 3
                      ? '<div class="sub">' + esc(T("STAGE PROGRESS")) + ' ' + w.progress + ' / ' + STAGE_TURNS + ' ' +
                        esc(T("turns (5 minutes each, only counted while stability is high enough)")) + '</div>' +
                        '<div class="bar"><i style="width:' + (Number(w.progress) / STAGE_TURNS * 100) + '%;background:#4cc2ff"></i></div>'
                      : "")
                : "") +
            '<div class="sub">' + esc(T("PRODUCTION")) + ' ' +
            (w.whole ? '<b style="color:#7dff9d">' + fmt(w.income) + '</b>' : '<b style="color:#b89598">0</b>') +
            ' ' + esc(T("into the plan every 5 minutes")) + '</div>' + actions + '</div>';

    }).join("");

}

function wireWorlds() {
    wireMiniMap();
    $("tabbody").querySelectorAll(".camp-btn").forEach(el => el.addEventListener("click", function() {
        draft.type = "military_campaign";
        draft.planet = el.dataset.p;
        tab = "new";
        renderTabs();
    }));
    $("tabbody").querySelectorAll(".calm-world").forEach(el => el.addEventListener("click", async function() {
        const planet = el.dataset.p;
        el.disabled = true;
        const { data, error } = await supabaseClient.rpc("unrest_calm", { p_planet: planet });
        if (error) { toast(error.message, true); await load(); return; }
        toast(planet + ": " + T("The world is calmer: unrest -20.") + " " + fmt(data.credits) + " " + T("credits left."));
        await load();
    }));
    $("tabbody").querySelectorAll(".fight-rebels").forEach(el => el.addEventListener("click", async function() {
        const planet = el.dataset.p;
        if (!window.confirm(T("Send the troops against the militia in ") + planet + T("? The militia will lose men, and so will the fleet."))) { return; }
        el.disabled = true;
        const { data, error } = await supabaseClient.rpc("unrest_fight", { p_planet: planet });
        if (error) { toast(error.message, true); await load(); return; }
        toast(planet + ": " + T("The rebels are beaten down.") + " " + data.killed + " " + T("militia dead,") + " " +
            data.lost + " " + T("soldiers lost,") + " " + T("bands left:") + " " + data.bands + ".");
        await load();
    }));
    $("tabbody").querySelectorAll(".policy-btn").forEach(el => el.addEventListener("click", async function() {
        el.disabled = true;
        const { error } = await supabaseClient.rpc("occupation_set_policy", { p_planet: el.dataset.p, p_policy: el.dataset.k });
        if (error) { toast(error.message, true); el.disabled = false; return; }
        toast(el.dataset.p + ": " + T("POLICY") + " " + T(POLICY_LABELS[el.dataset.k]));
        await load();
    }));
    $("tabbody").querySelectorAll(".relief-btn").forEach(el => el.addEventListener("click", async function() {
        const planet = el.dataset.p;
        if (!planet) { return; }
        el.disabled = true;
        const { error } = await supabaseClient.rpc("cs_submit", { p_type: "consolidation", p_planet: planet });
        if (error) { toast(error.message, true); el.disabled = false; return; }
        toast(T("Relief for") + " " + planet + " " + T("is before the Supreme Soviet: it takes effect if the vote passes."));
        await load();
    }));
}

/* ---- the authority the Soviet has granted ---- */

    const a = ov.authorizations;
    const fl = ov.fleets || { total: 0, max: 0, quotas: 0, next_price: 500 };
    const rel = ov.state.relations || {};
    const st = ov.state;
    const liveQuota = ov.directives.some(d => d.type === "fleet_construction" && (d.status === "introduction" || d.status === "debate"));

    let h = '<div class="tokens">' +
        '<div class="token">' + esc(T("FLEETS IN SERVICE")) + '<b>' + fl.total + ' / ' + fl.max + '</b><span class="sub">' + esc(T("of the maximum the Soviet permits")) + '</span></div>' +
        '<div class="token">' + esc(T("QUOTAS WAITING")) + '<b>' + fl.quotas + '</b><span class="sub">' + esc(T("one fleet each")) + '</span></div>' +
        '<div class="token">' + esc(T("ARMOURED DETACHMENTS")) + '<b>' + a.knightmare + '</b><span class="sub">' + esc(T("recruit into a fleet")) + '</span></div>' +
        '<div class="token">' + esc(T("APPROVED CAMPAIGNS")) + '<b>' + a.war.length + '</b><span class="sub">' + (a.war.length ? esc(a.war.join(", ")) : esc(T("none"))) + '</span></div></div>';

    h += '<div class="card active"><h3>' + esc(T("The fleet quota")) + '</h3>' +
        '<div class="sub">' + esc(T("The Soviet permits")) + ' <b style="color:#fff">' + fl.max + '</b> ' + esc(T("fleets:")) + ' ' +
        fl.total + ' ' + esc(T("in service and")) + ' ' + fl.quotas + ' ' + esc(T("quota(s) not yet spent")) + '. ' +
        esc(T("Every approved quota directive raises the maximum by one; building a fleet spends the quota instead of raising it.")) + '</div>' +
        '<div class="sub" style="margin-top:6px">' + esc(T("The next fleet costs")) + ' <b>' + fmt(fl.next_price) + '</b> ' +
        esc(T("credits, paid when it is built and not when the directive passes.")) + '</div>' +
        '<div style="margin-top:10px"><button class="btn" id="quota-go"' + (liveQuota ? " disabled" : "") + '>' +
        esc(T(liveQuota ? "A QUOTA IS ALREADY BEFORE THE SOVIET" : "PUT A FLEET QUOTA BEFORE THE SOVIET")) + '</button></div></div>';

    h += '<div class="card"><h3>' + esc(T("War room: a campaign against a world")) + '</h3>' +
        '<div class="sub" style="margin-bottom:8px">' + esc(T("Only players bring a campaign; the commissars never declare one. A majority is enough. Without an approved campaign Combine fleets cannot attack the planet.")) + '</div>' +
        miniMapHtml("war");

    const fronts = ov.targets.filter(t => t.owners !== "Combine" && t.owners !== "Unclaimed");

    h += (fronts.length ? fronts.map(function(t) {

        const live = ov.directives.some(d => d.type === "military_campaign" && d.planet === t.planet && (d.status === "introduction" || d.status === "debate"));

        return '<div class="fc" style="margin:7px 0"><span class="nm">' + esc(t.planet) + '</span>' +
            '<span class="sub" style="flex:1">' + esc(T(t.owners)) + '</span>' +
            (t.declared
                ? '<span class="badge pass">' + esc(T("APPROVED")) + '</span>'
                : live
                    ? '<span class="badge live">' + esc(T("BEFORE THE SOVIET")) + '</span>'
                    : '<button class="btn small camp-btn" data-p="' + esc(t.planet) + '">' + esc(T("PROPOSE")) + '</button>') + '</div>';

    }).join("") : '<div class="sub">' + esc(T("Every world is already ours.")) + '</div>') + '</div>';

    h += '<div class="card"><h3>' + esc(T("Standing")) + '</h3><div class="sub">' + esc(T("CONFIDENCE")) + ' ' + Math.round(st.popularity) + '% ' +
        esc(T("(it shifts every vote by up to \u00b110 points: a confident Party gets its way more often)")) + '</div>' +
        '<div class="bar"><i style="width:' + st.popularity + '%;background:#b32424"></i></div>' +
        '<div class="sub" style="margin-top:8px">' + esc(T("TAX LEVEL")) + ' ' + st.tax_level + ' ' + esc(T("of")) + ' 2 &middot; ' +
        esc(T("300-500 credits every 15 minutes per level")) + '</div>' +
        '<div class="sub" style="margin-top:4px">' +        esc(T("relations:")) + ' Freedom Authority ' + (rel["Freedom Authority"] || 0) + ' / 100</div></div>';

    h += '<div class="card"><h3>' + esc(T("The three currents")) + '</h3>' + ov.currents.map(function(c) {
        return '<div class="sub" style="padding:4px 0"><span class="dot" style="background:' + esc(c.color) + '"></span> <b style="color:#fff">' +
            esc(T(c.name)) + '</b> (' + c.seats + ' ' + esc(T("seats")) + '): ' + esc(T(c.description)) + '</div>';
    }).join("") + '</div>';

    return h;

}

function wireAuthority() {

    /* clicking a planet on the map chooses it as the target */

        if (el.style.cursor !== "pointer") { return; }
        draft.type = "military_campaign";
        draft.planet = el.dataset.p;
        tab = "new";
        renderTabs();
    }));

    $("tabbody").querySelectorAll(".camp-btn").forEach(el => el.addEventListener("click", function() {
        draft.type = "military_campaign";
        draft.planet = el.dataset.p;
        tab = "new";
        renderTabs();
    }));

    if ($("quota-go")) {
        $("quota-go").addEventListener("click", function() {
            draft.type = "fleet_construction";
            tab = "new";
            renderTabs();
        });

}

/* ---- a new directive ---- */
function newHtml() {

    const t = TYPES[draft.type];
    const need = t.votes === "qualified" ? ov.supermajority : ov.majority;

    let h = '<label class="row">' + esc(T("WHAT SHOULD THE SOVIET DECIDE?")) + '</label><select id="n-type" style="width:100%">' +
        Object.keys(TYPES).map(k => '<option value="' + k + '"' + (draft.type === k ? " selected" : "") + '>' + esc(T(TYPES[k].name)) + '</option>').join("") + '</select>' +
        '<div class="sub" style="margin-top:6px">' + esc(T(t.desc)) + '</div>';

    if (draft.type === "fleet_construction") {
        const fl = ov.fleets || { total: 0, max: 0, quotas: 0 };
        h += '<div class="sub" style="margin-top:6px">' + esc(T("FLEETS NOW:")) + ' <b style="color:#fff">' + fl.total + ' / ' + fl.max + '</b> ' +
            esc(T("(in service / the maximum the Soviet permits). This directive raises the maximum to")) + ' <b style="color:#7dff9d">' + (fl.max + 1) + '</b>.</div>';
    }

    if (draft.type === "military_campaign") {
        h += '<label class="row">' + esc(T("PLANET TO ATTACK")) + '</label><select id="n-planet" style="width:100%">' +
            (ov.targets.map(x => '<option value="' + esc(x.planet) + '"' + (draft.planet === x.planet ? " selected" : "") + (x.declared ? " disabled" : "") + '>' +
                esc(x.planet) + ' (' + esc(x.owners) + ')' + (x.declared ? " - " + esc(T("campaign approved")) : "") + '</option>').join("") ||
             '<option value="">' + esc(T("no targets")) + '</option>') + '</select>';
    }
    else if (draft.type === "fleet_revocation") {
        h += '<label class="row">' + esc(T("FLEET TO DISMANTLE")) + '</label><select id="n-fleet" style="width:100%">' +
            (ov.my_fleets.filter(f => f.transport_fleet !== true).map(f => '<option value="' + esc(f.id) + '"' + (draft.fleet === f.id ? " selected" : "") + '>' + esc(f.name) + '</option>').join("") || '<option value="">' + esc(T("you have no fleets")) + '</option>') + '</select>';
    }

    h += '<label class="row">' + esc(T("WHICH CURRENT SPEAKS FOR IT?")) + '</label><div class="spons">' +
        ov.currents.map(f => {
            const appeal = (f.priorities || []).indexOf(draft.type) !== -1;
            return '<div class="opt' + (draft.current === f.key ? " on" : "") + '" data-k="' + f.key + '"><span class="dot" style="background:' + esc(f.color) + '"></span> <b>' + esc(T(f.name)) + '</b> (' + f.seats + ')' +
                '<small>' + (appeal ? "&#9733; " + T("this is one of their priorities") : T("not a priority for them")) + '</small></div>';
        }).join("") + '</div><div class="sub" style="margin-top:6px">' +
        esc(T("Commissars of the sponsoring current vote for it far more often; currents near it tend to follow, distant ones oppose.")) + '</div>';

    h += '<div class="card" style="margin-top:14px"><div class="sub">' + T("COST:") + ' <b style="color:#7dff9d">' + T("free") + '</b> &middot; ' +
        T("VOTES NEEDED:") + ' <b style="color:#fff">' + need + ' ' + T("of") + ' ' + ov.seats + ' (' + esc(T(t.votes)) + ')</b></div>' +
        '<div class="sub" style="margin-top:4px">' + esc(T("Introduction 3 minutes, then 5 minutes of debate (privileges are possible), then the vote. A commander may have 3 directives before the Soviet at once.")) + '</div></div>' +
        '<button class="btn" id="n-go">' + esc(T("PUT BEFORE THE SOVIET")) + '</button>';

    return h;

}

function wireNew() {

    $("n-type").addEventListener("change", function() { draft.type = $("n-type").value; renderTabs(); });
    if ($("n-planet")) { $("n-planet").addEventListener("change", function() { draft.planet = $("n-planet").value; }); }
    if ($("n-fleet")) { $("n-fleet").addEventListener("change", function() { draft.fleet = $("n-fleet").value; }); }
    if ($("n-target")) { $("n-target").addEventListener("change", function() { draft.target = $("n-target").value; }); }

    $("tabbody").querySelectorAll(".spons .opt").forEach(el => el.addEventListener("click", function() { draft.current = el.dataset.k; renderTabs(); }));

    $("n-go").addEventListener("click", async function() {

        $("n-go").disabled = true;

        const { error } = await supabaseClient.rpc("cs_submit", {
            p_type: draft.type,
            p_planet: draft.type === "military_campaign" ? (draft.planet || null) : null,
            p_fleet: draft.type === "fleet_revocation" ? (draft.fleet || null) : null,
            p_target: draft.type === "diplomacy" ? draft.target : null,
            p_current: draft.current
        });

        $("n-go").disabled = false;

        if (error) { toast(error.message, true); return; }

        toast(T("Your directive is before the Soviet."));
        tab = "directives";
        await load();

    });

}

/* ---- news ---- */
function newsHtml() {

    if (!ov.log.length) { return '<div class="sub">' + esc(T("Nothing has happened yet.")) + '</div>'; }

    return ov.log.map(l => '<div class="log"><time>' +
        new Date(l.at).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) + '</time>' + esc(T(l.text)) + '</div>').join("");

}

/* ---------------------------------------------------------
   TIMERS + REFRESH
--------------------------------------------------------- */
setInterval(function() {

    if (!ov) { return; }

    document.querySelectorAll(".cdt").forEach(function(el) { el.textContent = mmss(secondsLeft(el.dataset.ts)); });

    document.querySelectorAll(".prop-cd").forEach(function(el) { el.textContent = mmss(secondsLeft(el.dataset.until)); });

    document.querySelectorAll(".relief-cd").forEach(function(el) { el.textContent = mmss(secondsLeft(el.dataset.until)); });

    document.querySelectorAll(".cd").forEach(function(el) {
        const d = ov.directives.find(x => x.id === Number(el.dataset.d));
        if (!d) { return; }
        const intro = d.status === "introduction";
        const s = secondsLeft(intro ? d.debate_at : d.vote_at);
        el.textContent = (intro ? el.dataset.intro : el.dataset.vote) + " " + mmss(s);
        if (s === 0) { load(); }
    });

}, 1000);

setInterval(function() { if (document.visibilityState === "visible") { load(); } }, 9000);

load();
