    for (const e of enemyUnits) { if (distance(e, target) < 220) { friends++; } }
    for (const p of playerUnits) { if (distance(p, target) < 220) { foes++; } }

    return target.health / target.maxHealth < 0.45 || friends >= foes + 1;

}

function updateEnemyAI(enemy, now) {

    const prof = aiProfiles[enemy.type] || aiProfiles.Rifle;

    let closest = null;
    let closestDistance = Infinity;

    for (const p of playerUnits) {
        const d = distance(enemy, p);
        if (d < closestDistance) { closestDistance = d; closest = p; }
    }

    if (!closest) { return; }

    enemy.attackTarget = closest;

    const canFire = closestDistance <= enemy.range && lineOfSight(enemy, closest);

    if (canFire) { shoot(enemy, closest, now); }

    const hpRatio = enemy.health / enemy.maxHealth;
    const sight = enemy.range * 1.7;

    if (enemy.nextCounter === undefined) {
        enemy.nextCounter = now + prof.counterEvery * (0.4 + Math.random() * 0.4);
    }

    let mode;

    if (hpRatio < prof.retreatHp && closestDistance < sight * 1.3) {
        mode = "retreat";
    }
    else if (enemy.counterUntil > now) {
        mode = "counter";
    }
    else if (closestDistance <= sight) {

        if (now >= enemy.nextCounter && shouldCounter(enemy, closest)) {
            enemy.counterUntil = now + prof.counterFor;
            enemy.nextCounter = now + prof.counterEvery;
            mode = "counter";
        }
        else {
            mode = "engage";
        }

    }
    else {
        mode = "hold";
    }

    enemy.aiMode = mode;

    const slot = Math.max(0, parseInt(String(enemy.id).replace("E", ""), 10) || 0);

    if (mode === "counter") {
        aiMoveTo(enemy, getEnemyAttackPosition(enemy, closest, slot), now);
    }
    else if (mode === "retreat") {
        const spot = getAISpot(enemy, closest, false, now);
        if (spot) { aiMoveTo(enemy, spot, now); }
    }
    else if (mode === "engage") {
        if (canFire) { return; }
        const spot = getAISpot(enemy, closest, true, now);
        aiMoveTo(enemy, spot || getEnemyAttackPosition(enemy, closest, slot), now);
    }
    else {

        /* nobody in sight yet: creep forward from cover to cover, units staggered */
        if (enemy.nextAdvance === undefined) { enemy.nextAdvance = now + Math.random() * 4000; }

        if (now >= enemy.nextAdvance) {
            const spot = pickAdvanceSpot(enemy, closest, prof);
            if (spot) { enemy.advanceSpot = spot; }
            enemy.nextAdvance = now + 3500 + Math.random() * 3500;
        }

        if (enemy.advanceSpot) { aiMoveTo(enemy, enemy.advanceSpot, now); }

    }

}


/* =========================================
   COMBAT UPDATE
========================================= */

function runManualUnit(unit, now) {

    const target = acquireAutomaticTarget(unit);

    if (!target) { return; }

    const d = distance(unit, target);
    const hasLineOfSight = unit.indirect || lineOfSight(unit, target);

    if (d <= unit.range && hasLineOfSight) {
        shoot(unit, target, now);
        return;
    }

    /* units only chase when the player ordered an attack */
    if (!unit.attackOrder) { return; }

    const attackPosition = getAttackPosition(unit, target);

    if (shouldRefreshPath(unit, attackPosition, now)) {
        setUnitDestination(unit, attackPosition.x, attackPosition.y);
    }

}

function updateCombat(now) {

    /* ATTACKING DIVISIONS (the host's and any reinforcing attackers) */

    for (const unit of [...playerUnits]) {
        runManualUnit(unit, now);
    }

    /* DEFENDING DIVISIONS: the garrison is AI, reinforcing defenders are played by humans */

    for (const enemy of [...enemyUnits]) {

        if (playerUnits.length === 0) { break; }

        if (enemy.human) {
            runManualUnit(enemy, now);
        }
        else {
            updateEnemyAI(enemy, now);
        }

    }

}


/* =========================================
   FLEET STATE
========================================= */

function buildSurvivingFleetState() {

    const grouped = new Map();

    for (const unit of myUnits()) {

        const remaining = getCurrentUnitSoldiers(unit);

        if (remaining <= 0) { continue; }

        if (!grouped.has(unit.type)) {
            grouped.set(unit.type, {
                type: unit.type,
                soldiers: 0,
                soldiersPerDivision: unit.divisionSize
            });
        }

        grouped.get(unit.type).soldiers += remaining;

    }

    /* Knightmare squads keep their recruiting dates (the oldest ones survive) */
    const source = isGuest ? guestSquads : ((fleetState && fleetState.squads) || []);
    const bornList = [];

    for (const e of source) {
        if (e.type === "Knightmare") {
            const n = Math.max(0, Number(e.amount) || 0);
            const born = (e.born || []).slice();
            while (born.length < n) { born.unshift("1970-01-01T00:00:00Z"); }
            bornList.push(...born);
        }
    }

    bornList.sort();

    return Array.from(grouped.values()).map(function(entry) {

        const out = {
            type: entry.type,
            amount: Math.ceil(entry.soldiers / entry.soldiersPerDivision),
            soldiers: entry.soldiers,
            soldiersPerDivision: entry.soldiersPerDivision
        };

        if (entry.type === "Knightmare") { out.born = bornList.slice(0, out.amount); }

        return out;

    });

}

function getInitialFleetSoldiers() {
    return expandFleetDivisions(fleetState.squads || [])
        .reduce((total, division) => total + division.soldiers, 0);
}

function getRemainingFleetSoldiers() {
    return myUnits().reduce((total, unit) => total + getCurrentUnitSoldiers(unit), 0);
}

function getEnemyInitialSoldiers() {
    return enemyInitialSoldiers;
}

function getEnemyRemainingSoldiers() {
    /* only the garrison counts here; reinforcing human defenders save their own fleets */
    return enemyUnits.filter(unit => !unit.human).reduce((total, unit) => total + getCurrentUnitSoldiers(unit), 0);
}


/* =========================================
   SAVE RESULT
========================================= */

async function saveBattleResult() {

    if (battleResolved) {
        return true;
    }

    if (!battleID) {
        console.error("No battle ID.");
        return false;
    }

    battleResolved = true;

    const survivingFleet = buildSurvivingFleetState();
    const initialPlayerSoldiers = getInitialFleetSoldiers();
    const remainingPlayerSoldiers = getRemainingFleetSoldiers();
    const initialEnemySoldiers = getEnemyInitialSoldiers();
    const remainingEnemySoldiers = getEnemyRemainingSoldiers();

    const playerLosses = Math.max(0, initialPlayerSoldiers - remainingPlayerSoldiers);
    const enemyLosses = Math.max(0, initialEnemySoldiers - remainingEnemySoldiers);

    setBattleMessage("Saving battle result...");

    const { data, error } = await supabaseClient.rpc("resolve_city_battle", {
        battle_id: battleID,
        battle_result: battleResult,
        remaining_fleet_state: survivingFleet,
        defender_initial_soldiers: initialEnemySoldiers,
        defender_remaining_soldiers: remainingEnemySoldiers
    });

    if (error) {
        console.error("Battle save error:", error);
        battleResolved = false;
        setBattleMessage("Could not save battle result: " + error.message);
        return false;
    }

    console.log("Battle result saved:", data);

    document.getElementById("battle-loss-summary").innerHTML =
        "<strong>" +
        "Your losses: " + formatSoldiers(playerLosses) + " soldiers" +
        "</strong>" +
        "<br>" +
        "Enemy losses: " + formatSoldiers(enemyLosses) + " soldiers";

    return true;

}


/* =========================================
   VICTORY / DEFEAT
========================================= */

function checkVictory() {

    if (!battleActive) { return; }

    if (enemyUnits.length === 0) {
        finishBattle("victory");
        return;
    }

    if (playerUnits.length === 0) {
        finishBattle("defeat");
    }

}

async function finishBattle(result) {

    if (!battleActive) { return; }

    battleActive = false;
    battleResult = result;

    endLiveBattle(result);

    /* The database must be updated before the victory cinematic begins. */
    const saved = await saveBattleResult();

    if (!saved) {
        battleResult = null;
        battleActive = false;
        const screen = document.getElementById("victory-screen");
        const title = document.getElementById("victory-title");
        const description = document.getElementById("victory-description");
        title.textContent = "SAVE FAILED";
        title.style.color = "#e8c46a";
        description.textContent = "The battle ended, but the result could not be saved.";
        screen.classList.add("visible");
        return;
    }

    if (result === "victory") {
        startVictoryCutscene();
        return;
    }

    const screen = document.getElementById("victory-screen");
    const title = document.getElementById("victory-title");
    const description = document.getElementById("victory-description");

    title.textContent = "DEFEAT";
    title.style.color = "#ff4c4c";
    description.textContent = "Your attacking force was defeated.";
    screen.classList.add("visible");
    setBattleMessage("Battle result saved.");
}


/* =========================================
   MOUSE
========================================= */

function getMousePosition(event) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
    };
}

canvas.addEventListener("mousedown", function(event) {

    if (!battleActive || event.button !== 0) { return; }

    const mouse = getMousePosition(event);
    const clickedEnemy = findEnemyAt(mouse.x, mouse.y);

    if (clickedEnemy && selectedUnits.length > 0) {
        orderGroupAttack(clickedEnemy);
        return;
    }

    const clickedPlayer = findPlayerAt(mouse.x, mouse.y);

    if (clickedPlayer) {
        selectPlayerUnit(clickedPlayer, event.shiftKey);
        return;
    }

    isDraggingSelection = true;

    dragStartX = mouse.x;
    dragStartY = mouse.y;
    dragCurrentX = mouse.x;
    dragCurrentY = mouse.y;

    if (!event.shiftKey) {
        clearSelection();
    }

});

canvas.addEventListener("mousemove", function(event) {

    if (!isDraggingSelection) { return; }

    const mouse = getMousePosition(event);

    dragCurrentX = mouse.x;
    dragCurrentY = mouse.y;

});

canvas.addEventListener("mouseup", function(event) {

    if (event.button !== 0 || !isDraggingSelection) { return; }

    isDraggingSelection = false;

    const mouse = getMousePosition(event);

    dragCurrentX = mouse.x;
    dragCurrentY = mouse.y;

    const left = Math.min(dragStartX, dragCurrentX);
    const right = Math.max(dragStartX, dragCurrentX);
    const top = Math.min(dragStartY, dragCurrentY);
    const bottom = Math.max(dragStartY, dragCurrentY);

    if (right - left < 5 && bottom - top < 5) {
        if (!event.shiftKey) { clearSelection(); }
        return;
    }

    const units = myUnits().filter(unit =>
        unit.x >= left && unit.x <= right &&
        unit.y >= top && unit.y <= bottom
    );

    if (event.shiftKey) {

        for (const unit of units) {
            if (!selectedUnits.includes(unit)) {
                unit.selected = true;
                selectedUnits.push(unit);
            }
        }

        setBattleMessage(selectedUnits.length + " divisions selected.");

    }
    else {
        setSelection(units);
    }

});

========================================= */

canvas.addEventListener("contextmenu", function(event) {

    event.preventDefault();

    if (!battleActive || selectedUnits.length === 0) { return; }

    const mouse = getMousePosition(event);
    const spacing = 30;
    const columns = Math.max(1, Math.ceil(Math.sqrt(selectedUnits.length)));
    const rowCount = Math.ceil(selectedUnits.length / columns);

    const guestOrders = [];

    selectedUnits.forEach(function(unit, index) {

        const column = index % columns;
        const row = Math.floor(index / columns);

        const targetX = mouse.x + (column - (columns - 1) / 2) * spacing;
        const targetY = mouse.y + (row - (rowCount - 1) / 2) * spacing;

        if (isGuest) {
            const n = cityNorm(targetX, targetY);
            guestOrders.push({ id: unit.id, x: +n[0].toFixed(4), y: +n[1].toFixed(4) });
            return;
        }

        unit.attackTarget = null;
        unit.attackOrder = false;
        unit.nextPathUpdate = 0;

        setUnitDestination(unit, targetX, targetY);

    });

    if (isGuest) { liveSend("cmd", { uid: myUid, kind: "move", orders: guestOrders }); }

    setBattleMessage(selectedUnits.length + " divisions moving.");

});

let lastFrameTime = performance.now();

function updateUnits(now) {

    if (victoryCutscene) {
        updateVictoryCutscene(now);
        return;
    }

    if (!battleActive) { return; }

    if (isGuest) { updateGuest(now); return; }

    const dt = Math.min(.05, (now - lastFrameTime) / 1000);

    lastFrameTime = now;

    updateCombat(now);
    updateProjectiles(dt, now);

    for (const unit of [...playerUnits, ...enemyUnits]) {

        if (unit.hitFlash > 0) {
            unit.hitFlash = Math.max(0, unit.hitFlash - dt * 1000);
        }

        if (unit.path.length > 0) {
            moveAlongPath(unit, now, dt);
        }
        else {
            separateIdleUnit(unit, dt);
        }

    }

    checkVictory();

}



function startVictoryCutscene() {

    if (victoryCutscene) { return; }

    const cinematic = document.getElementById("victory-cinematic");
    const caption = document.getElementById("victory-caption");
    const captionCity = document.getElementById("victory-caption-city");
    const finalCard = document.getElementById("victory-final-card");
    const finalDescription = document.getElementById("victory-final-description");
    const continueButton = document.getElementById("victory-continue");

    const survivors = playerUnits.filter(function(unit) {
        return unit && unit.health > 0 && unit.soldiers > 0;
    });

    const city = getCityBounds();
    const bannerX = city.x + cityWidth() * 0.58;
    const bannerY = city.y + cityHeight() * 0.48;

    const actors = survivors.map(function(unit, index) {
        const angle = -Math.PI * 0.82 + (index / Math.max(1, survivors.length - 1)) * Math.PI * 0.64;
        const radiusX = Math.min(150, cityWidth() * 0.23);
        const radiusY = Math.min(105, cityHeight() * 0.25);
        const target = findSafePosition(
            bannerX + Math.cos(angle) * radiusX,
            bannerY + Math.sin(angle) * radiusY
        );
        return {
            unit: unit,
            fromX: unit.x,
            fromY: unit.y,
            toX: target.x,
            toY: target.y
        };
    });

    clearSelection();
    projectiles.length = 0;
    shotEffects.length = 0;
    damageNumbers.length = 0;

    for (const unit of playerUnits.concat(enemyUnits)) {
        unit.path = [];
        unit.attackTarget = null;
        unit.attackOrder = false;
    }

    cinematic.classList.add("active", "banner-stage");
    cinematic.style.setProperty("--victory-color", factionColor(playerFaction));
    captionCity.textContent = cityName.toUpperCase();
    finalDescription.textContent = cityName.toUpperCase() + " IS NOW CONTROLLED BY " + playerFaction.toUpperCase() + ".";
    document.getElementById("victory-caption-title").style.color = factionColor(playerFaction);
    document.getElementById("victory-final-title").style.color = factionColor(playerFaction);

    victoryCutscene = {
        started: performance.now(),
        actors: actors,
        bannerX: bannerX,
        bannerY: bannerY,
        duration: 9000
    };

    setBattleMessage("Victory secured. Occupying " + cityName + "...");

    setTimeout(function() {
        if (!victoryCutscene) { return; }
        caption.classList.add("show");
    }, 2700);

    setTimeout(function() {
        if (!victoryCutscene) { return; }
        finalCard.classList.add("show");
    }, 5200);

    const returnToPlanet = function() {
        if (victoryReturnTimer) { clearTimeout(victoryReturnTimer); }
        window.location.href = "planet.html?name=" + encodeURIComponent(planetName);
    };

    continueButton.onclick = returnToPlanet;
    victoryReturnTimer = setTimeout(returnToPlanet, 9000);
}

function updateVictoryCutscene(now) {

    if (!victoryCutscene) { return; }

    const elapsed = now - victoryCutscene.started;
    const moveEnd = 2200;
    const celebrateStart = 3000;

    for (const actor of victoryCutscene.actors) {
        const unit = actor.unit;
        if (!unit || unit.health <= 0) { continue; }

        if (elapsed < moveEnd) {
            const raw = Math.max(0, Math.min(1, elapsed / moveEnd));
            const t = raw * raw * (3 - 2 * raw);
            unit.x = actor.fromX + (actor.toX - actor.fromX) * t;
            unit.y = actor.fromY + (actor.toY - actor.fromY) * t;
            unit.facing = Math.atan2(actor.toY - actor.fromY, actor.toX - actor.fromX);
        }
        else if (elapsed >= celebrateStart) {
            const pulse = Math.sin((elapsed - celebrateStart) / 170 + idHash(unit)) * 0.035;
            unit.x = actor.toX + Math.cos((idHash(unit) % 360) * Math.PI / 180) * pulse * 35;
            unit.y = actor.toY + Math.sin((idHash(unit) % 360) * Math.PI / 180) * pulse * 35;
        }
    }
}


function drawVictoryCelebration(now) {

    if (!victoryCutscene) { return; }

    const elapsed = now - victoryCutscene.started;
    if (elapsed < 3000) { return; }

    const strength = Math.min(1, (elapsed - 3000) / 900);

    ctx.save();
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.28 + strength * 0.45;

    for (const actor of victoryCutscene.actors) {
        const unit = actor.unit;
        if (!unit || unit.health <= 0) { continue; }

        const phase = now / 180 + idHash(unit);
        const lift = 5 + Math.sin(phase) * 3;
        const baseY = unit.y - 14 - lift;
        const arm = 8 + Math.sin(phase * 1.2) * 2;

        ctx.strokeStyle = factionColor(unit.faction);
        ctx.beginPath();
        ctx.moveTo(unit.x - arm, baseY + 5);
        ctx.lineTo(unit.x - arm - 4, baseY - 5);
        ctx.moveTo(unit.x + arm, baseY + 5);
        ctx.lineTo(unit.x + arm + 4, baseY - 5);
        ctx.stroke();
    }

    ctx.globalAlpha = 1;
    ctx.restore();
}

function drawVictoryBanner(now) {

    if (!victoryCutscene) { return; }

    const elapsed = now - victoryCutscene.started;
    const rise = Math.max(0, Math.min(1, (elapsed - 900) / 1500));
    const eased = rise * rise * (3 - 2 * rise);
    const x = victoryCutscene.bannerX;
    const groundY = victoryCutscene.bannerY + 62;
    const topY = groundY - 125 * eased;
    const color = factionColor(playerFaction);

    ctx.save();

    const glow = ctx.createRadialGradient(x, groundY - 70, 5, x, groundY - 70, 100);
    glow.addColorStop(0, color + "55");
    glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(x - 120, groundY - 190, 240, 220);

    ctx.strokeStyle = "#b9b9b9";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, groundY);
    ctx.lineTo(x, topY);
    ctx.stroke();

    const wave = Math.sin(now / 190) * 5;
    const flagWidth = 72;
    const flagHeight = 42;

    ctx.beginPath();
    ctx.moveTo(x + 2, topY + 4);
    ctx.quadraticCurveTo(x + 22, topY + wave, x + flagWidth, topY + 7 + wave);
    ctx.lineTo(x + flagWidth, topY + flagHeight + wave);
    ctx.quadraticCurveTo(x + 25, topY + flagHeight - 2 + wave, x + 2, topY + flagHeight - 1);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.96;
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.strokeStyle = "rgba(255,255,255,.55)";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();
}

/* the game's own confirmation box, drawn exactly like the NOTICE card the
   rest of the game shows (the browser's confirm() cannot be styled) */
function gameConfirm(message, title) {

    return new Promise(function(resolve) {

        const old = document.getElementById("game-confirm");
        if (old) { old.remove(); }

        const overlay = document.createElement("div");
        overlay.id = "game-confirm";
        overlay.style.cssText =
            "position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;";

        const card = document.createElement("div");
        card.style.cssText =
            "width:380px;max-width:90vw;background:rgba(8,12,22,.97);border:1px solid #7fdcff;" +
            "box-shadow:0 0 24px rgba(80,200,255,.35);padding:18px 20px;color:#dfeaf2;" +
            "font:14px Arial,sans-serif;line-height:1.5;";

        const h = document.createElement("div");
        h.style.cssText = "font-weight:bold;letter-spacing:2px;color:#7fdcff;margin-bottom:8px;";
        h.textContent = (title || "NOTICE").toUpperCase();

        const p = document.createElement("div");
        p.textContent = message;

        const row = document.createElement("div");
        row.style.cssText = "display:flex;gap:8px;margin-top:14px;";

        const yes = document.createElement("button");
        yes.type = "button";
        yes.textContent = "OK";
        yes.style.cssText =
            "padding:7px 26px;background:#10202e;color:#fff;border:1px solid #7fdcff;cursor:pointer;font-weight:bold;";

        const no = document.createElement("button");
        no.type = "button";
        no.textContent = "CANCEL";
        no.style.cssText =
            "padding:7px 20px;background:transparent;color:#cfe3ff;border:1px solid #355690;cursor:pointer;font-weight:bold;";

        const finish = function(ok) {
            overlay.remove();
            document.removeEventListener("keydown", onKey);
            resolve(ok);
        };

        const onKey = function(e) {
            if (e.key === "Escape") { finish(false); }
            else if (e.key === "Enter") { finish(true); }
        };

        yes.addEventListener("click", function() { finish(true); });
        no.addEventListener("click", function() { finish(false); });
        overlay.addEventListener("click", function(e) { if (e.target === overlay) { finish(false); } });
        document.addEventListener("keydown", onKey);

        row.appendChild(yes);
        row.appendChild(no);
        card.appendChild(h);
        card.appendChild(p);
        card.appendChild(row);
        overlay.appendChild(card);
        document.body.appendChild(overlay);
        yes.focus();

    });

}

/* =========================================
   REINFORCEMENTS (join a battle in progress)

   The player who started the battle is the HOST: his browser runs the
   whole simulation and broadcasts a snapshot five times a second.
   Players who arrive later are GUESTS: they are verified by the database,
   their divisions are spawned by the host (attackers join the attacking
   side, defenders take command of reinforcing garrison units) and they
   send move / attack orders back over the same realtime channel.
   Positions travel as fractions of the city, so any screen size works.
========================================= */

function cityNorm(x, y) {
    const c = getCityBounds();
    return [(x - c.x) / cityWidth(), (y - c.y) / cityHeight()];
}

function cityDenorm(nx, ny) {
    const c = getCityBounds();
    return { x: c.x + nx * cityWidth(), y: c.y + ny * cityHeight() };
}

function liveSend(event, payload) {

    if (!liveChannel) { return; }

    try {
        liveChannel.send({ type: "broadcast", event: event, payload: payload });
    }
    catch (error) {
        console.warn("Live send failed:", error);
    }

}

/* ---------------- HOST ---------------- */

async function startLiveBattle() {

    try {

        const bid = String(battleID);

        const { error } = await supabaseClient.rpc("live_battle_open", {
            p_battle: bid,
            p_planet: planetName,
            p_city: cityName,
            p_attacker: playerFaction,
            p_defender: enemyFaction,
            p_fleet: String(fleetID)
        });

        if (error) {
            /* stage8.sql not run yet: the battle simply stays single-player */
            console.warn("Reinforcements unavailable:", error.message);
            return;
        }

        liveChannel = supabaseClient.channel("lb-" + bid, { config: { broadcast: { self: false } } });

        liveChannel
            .on("broadcast", { event: "join" }, function(m) { hostHandleJoin(m.payload); })
            .on("broadcast", { event: "cmd" }, function(m) { hostHandleCmd(m.payload); })
            .subscribe();

        liveTimers.push(setInterval(function() {
            supabaseClient.rpc("live_battle_beat", { p_battle: bid }).then(function() {});
        }, 10000));

        liveTimers.push(setInterval(function() { broadcastSnapshot(false); }, 200));

    }
    catch (error) {
        console.warn("Could not open the battle to reinforcements:", error);
    }

}

async function hostHandleJoin(p) {

    if (!p || !p.fleetId || !battleActive) { return; }

    const key = String(p.fleetId);

    if (liveGuests[key]) { return; }

    liveGuests[key] = "pending";

    try {

        const { data, error } = await supabaseClient.rpc("reinforcement_check", {
            p_battle: String(battleID),
            p_fleet: key
        });

        if (error || !data || (p.uid && String(data.player_id) !== String(p.uid))) {
            delete liveGuests[key];
            return;
        }

        spawnGuestUnits(data);
        liveGuests[key] = "ready";

    }
    catch (error) {
        delete liveGuests[key];
        console.warn("Join check failed:", error);
    }

}

function spawnGuestUnits(info) {

    const divisions = expandFleetDivisions(info.squads || []);
    const side = info.side === "defender" ? "D" : "A";
    const city = getCityBounds();
    const spacing = 38;
    const group = liveGuestCount;

    divisions.forEach(function(division, index) {

        const column = Math.floor(index / 7);
        const row = index % 7;

        let x;
        let y = city.y + 30 + row * spacing;

        if (side === "A") {
            x = city.x - 75 + (3 + column + group * 2) * spacing;
        }
        else {
            x = city.x + cityWidth() - 40 - (column + group * 2) * spacing;
        }

        const unit = createUnit(
            x, y,
            side === "A" ? playerFaction : enemyFaction,
            (side === "A" ? "GA" : "GD") + (guestSeq++),
            division.type,
            division.soldiers
        );

        unit.side = side;
        unit.owner = info.player_id;
        unit.human = side === "D";

        (side === "A" ? playerUnits : enemyUnits).push(unit);

    });

    liveGuestCount++;

    setBattleMessage(
        "Reinforcements have arrived for the " + (side === "A" ? "attackers" : "garrison") +
        " (" + divisions.length + " divisions)."
    );

}

function hostHandleCmd(p) {

    if (!p || !p.uid || !battleActive) { return; }

    const owned = function(id) {
        const unit = findUnitById(id);
        return unit && unit.owner === p.uid ? unit : null;
    };

    if (p.kind === "move") {

        for (const order of p.orders || []) {

            const unit = owned(order.id);

            if (!unit) { continue; }

            const t = cityDenorm(Number(order.x), Number(order.y));

            unit.attackTarget = null;
            unit.attackOrder = false;
            unit.nextPathUpdate = 0;

            setUnitDestination(unit, t.x, t.y);

        }

    }
    else if (p.kind === "attack") {

        const target = findUnitById(p.target);

        if (!target) { return; }

        for (const id of p.ids || []) {

            const unit = owned(id);

            if (!unit || unit.side === target.side) { continue; }

            unit.attackTarget = target;
            unit.attackOrder = true;
            unit.nextPathUpdate = 0;
            unit.path = [];
            unit.pathIndex = 0;
            unit.progressTime = 0;

        }

    }

}

function broadcastSnapshot(force) {

    if (!liveChannel || liveGuestCount === 0) { return; }
    if (!battleActive && !force) { return; }

    const owners = [];

    const row = function(u) {

        let oi = -1;

        if (u.owner && u.owner !== myUid) {
            oi = owners.indexOf(u.owner);
            if (oi < 0) { owners.push(u.owner); oi = owners.length - 1; }
        }

        const n = cityNorm(u.x, u.y);

        return [u.id, u.side, u.type, +n[0].toFixed(4), +n[1].toFixed(4),
                Math.round(u.soldiers), +u.health.toFixed(1), +(u.facing || 0).toFixed(2), oi];

    };

    liveSend("snap", {
        u: [...playerUnits, ...enemyUnits].map(row),
        o: owners,
        s: shotLog.splice(0)
    });

}

function endLiveBattle(result) {

    if (!liveChannel) { return; }

    broadcastSnapshot(true);
    liveSend("end", { result: result });

    for (const t of liveTimers) { clearInterval(t); }
    liveTimers = [];

    supabaseClient.rpc("live_battle_close", { p_battle: String(battleID) }).then(function() {});

    const channel = liveChannel;

    /* keep the channel a moment so the last messages leave */
    setTimeout(function() { supabaseClient.removeChannel(channel); }, 3000);
    setTimeout(function() { liveSend("end", { result: result }); }, 700);

}

/* ---------------- GUEST ---------------- */

async function loadGuest() {

    const { data: userData, error: userError } = await supabaseClient.auth.getUser();

    if (userError || !userData.user) {
        setBattleMessage("Not authenticated.");
        return;
    }

    if (!fleetID) {
        setBattleMessage("No fleet specified.");
        return;
    }

    myUid = userData.user.id;

    await supabaseClient.rpc("finalize_recruits");

    const { data, error } = await supabaseClient.rpc("reinforcement_join", {
        p_battle: String(joinBattleID),
        p_fleet: String(fleetID)
    });

    if (error || !data) {
        setBattleMessage("Could not join the battle: " + (error ? error.message : "no answer"));
        return;
    }

    mySide = data.side === "defender" ? "D" : "A";
    guestSquads = data.squads || [];
    guestInitialSoldiers = expandFleetDivisions(guestSquads).reduce((n, d) => n + d.soldiers, 0);

    battleActive = true;
    lastSnapAt = performance.now();

    setBattleMessage(
        "Reinforcing the " + (mySide === "D" ? "garrison" : "attackers") +
        ". Waiting for the battle commander to deploy your divisions..."
    );

    liveChannel = supabaseClient.channel("lb-" + joinBattleID, { config: { broadcast: { self: false } } });

    liveChannel
        .on("broadcast", { event: "snap" }, function(m) { applySnapshot(m.payload); })
        .on("broadcast", { event: "end" }, function(m) { guestFinish(m.payload); })
        .subscribe(function(status) {

            if (status !== "SUBSCRIBED") { return; }

            const hello = function() { liveSend("join", { uid: myUid, fleetId: String(fleetID) }); };

            hello();

            joinRetry = setInterval(function() {
                if (gotSnap || guestEnded) { clearInterval(joinRetry); return; }
                hello();
            }, 2500);

        });

}

function applySnapshot(s) {

    if (!s || !s.u || guestEnded) { return; }

    gotSnap = true;
    lastSnapAt = performance.now();

    const seen = new Set();

    for (const row of s.u) {

        const id = row[0];
        const side = row[1];
        const pos = cityDenorm(row[3], row[4]);

        seen.add(id);

        let unit = ghostById.get(id);

        if (!unit) {

            unit = createUnit(pos.x, pos.y, side === "A" ? playerFaction : enemyFaction, id, row[2], row[5]);
            unit.x = pos.x;
            unit.y = pos.y;
            unit.side = side;
            unit.owner = row[8] >= 0 ? s.o[row[8]] : null;

            ghostById.set(id, unit);
            (side === "A" ? playerUnits : enemyUnits).push(unit);

        }

        if (row[6] < unit.health) { unit.hitFlash = 100; }

        unit.tx = pos.x;
        unit.ty = pos.y;
        unit.soldiers = row[5];
        unit.health = row[6];
        unit.facing = row[7];

        if (unit.members) {
            const alive = Math.max(0, Math.min(3, Math.round(row[5])));
            unit.members = [0, 1, 2].map(i => i < alive ? Math.max(1, unit.health / Math.max(1, alive)) : 0);
        }

    }

    for (const [id, unit] of ghostById) {

        if (seen.has(id)) { continue; }

        ghostById.delete(id);

        for (const list of [playerUnits, enemyUnits, selectedUnits]) {
            const i = list.indexOf(unit);
            if (i !== -1) { list.splice(i, 1); }
        }

    }

    for (const sh of s.s || []) {

        const a = cityDenorm(sh[1], sh[2]);
        const e = cityDenorm(sh[3], sh[4]);
        const stats = unitStats[sh[0]] || unitStats.Rifle;

        spawnProjectile(
            { type: sh[0], x: a.x, y: a.y, damage: stats.damage, indirect: !!stats.indirect },
            sh[6] ? ghostById.get(sh[6]) || null : null,
            e.x, e.y, !!sh[5]
        );

        const shooter = sh[7] ? ghostById.get(sh[7]) : null;

        if (shooter && shooter.members) {
            shooter.fxKind = sh[0] === "KnightCannon" ? "cannon" : "rifle";
            shooter.fxUntil = performance.now() + (sh[0] === "KnightCannon" ? 400 : 140);
        }

    }

    if (myUnits().length > 0 && !guestEnded && /Waiting for the battle commander|Aguardando o comandante da batalha/.test(document.getElementById("battle-message").textContent)) {
        setBattleMessage("Your divisions are in the battle. Select them and give orders.");
    }

}

function updateGuest(now) {

    const dt = Math.min(.05, (now - lastFrameTime) / 1000);

    lastFrameTime = now;

    const k = Math.min(1, dt * 12);

    for (const unit of [...playerUnits, ...enemyUnits]) {

        if (unit.tx !== undefined) {
            unit.x += (unit.tx - unit.x) * k;
            unit.y += (unit.ty - unit.y) * k;
        }

        if (unit.hitFlash > 0) { unit.hitFlash = Math.max(0, unit.hitFlash - dt * 1000); }

    }

    updateProjectiles(dt, now);

    /* the commander's browser stopped answering */
    if (!guestEnded && now - lastSnapAt > (gotSnap ? 15000 : 45000)) {
        guestFinish({ result: "lost-contact" });
    }

}

async function guestFinish(payload) {

    if (guestEnded) { return; }

    guestEnded = true;
    battleActive = false;
    clearInterval(joinRetry);

    const result = payload && payload.result;
    const screen = document.getElementById("victory-screen");
    const title = document.getElementById("victory-title");
    const description = document.getElementById("victory-description");
    const summary = document.getElementById("battle-loss-summary");

    if (result === "lost-contact") {

        battleResult = "abandoned";

        title.textContent = "CONTACT LOST";
        title.style.color = "#e8c46a";
        description.textContent = "The battle commander stopped responding. Your fleet was not committed.";
        summary.textContent = "No losses recorded.";
        screen.classList.add("visible");

        return;

    }

    const attackersWon = result === "victory";
    const iWon = mySide === "A" ? attackersWon : !attackersWon;

    battleResult = iWon ? "victory" : "defeat";

    title.textContent = iWon ? "VICTORY" : "DEFEAT";
    title.style.color = iWon ? "#4cff72" : "#ff4c4c";
    description.textContent = mySide === "A"
        ? (attackersWon ? "The garrison is broken. The city has fallen." : "The assault failed.")
        : (attackersWon ? "The city has fallen." : "The attackers were thrown back. The city holds.");

    summary.textContent = "Saving your fleet...";
    screen.classList.add("visible");

    const remainingFleet = buildSurvivingFleetState();
    const remainingSoldiers = getRemainingFleetSoldiers();
    const lost = Math.max(0, guestInitialSoldiers - remainingSoldiers);

    const { error } = await supabaseClient.rpc("reinforcement_report", {
        p_battle: String(joinBattleID),
        p_fleet: String(fleetID),
        p_remaining: remainingFleet,
        p_lost: Math.round(lost)
    });

    summary.innerHTML = error
        ? "Could not save your fleet: " + error.message
        : "<strong>Your losses: " + formatSoldiers(lost) + " soldiers</strong>";

}


/* =========================================
   START
========================================= */

if (isGuest) { loadGuest(); }
else { loadFleet(); }

requestAnimationFrame(gameLoop);
